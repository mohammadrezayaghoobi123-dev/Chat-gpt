name: Repository Security Audit

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    name: Secret scan (full Git history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Scan every fetched Git ref and commit
        run: /tmp/gitleaks-8.30.1/gitleaks git --redact --exit-code 2 --log-opts="--all" .

  shell-script-validation:
    name: Validate Dev Container shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shell syntax
        run: bash -n .devcontainer/*.sh

  dependency-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - cloud-agent
          - cloud-engineering-connector
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Resolve exact declared dependencies
        run: npm install --ignore-scripts --no-fund --legacy-peer-deps
      - name: Audit dependency tree
        run: npm audit --audit-level=high
