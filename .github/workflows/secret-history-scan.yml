name: Full History Secret Scan

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: full-history-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    name: Gitleaks PR diff and all fetched refs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan pull request change range
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan every fetched Git ref and reachable commit
        shell: bash
        env:
          GITLEAKS_CONFIG: ".gitleaks.toml"
        run: |
          set +e
          /tmp/gitleaks-8.30.1/gitleaks git --redact --exit-code 2 --report-format json --report-path "$RUNNER_TEMP/gitleaks-full-history.json" --log-opts="--all" .
          scan_status=$?
          if [ -f "$RUNNER_TEMP/gitleaks-full-history.json" ]; then
            jq -r '.[] | [.Description, .File, (.StartLine|tostring), (.EndLine|tostring), .Commit, .RuleID, .Author, .Date] | @tsv' "$RUNNER_TEMP/gitleaks-full-history.json"
            umask 077
            diagnostic_report="$RUNNER_TEMP/gitleaks-diagnostic-unredacted.json"
            diagnostic_log="$RUNNER_TEMP/gitleaks-diagnostic-unredacted.log"
            trap 'rm -f "$diagnostic_report" "$diagnostic_log"' EXIT
            /tmp/gitleaks-8.30.1/gitleaks git --redact=0 --exit-code 2 --report-format json --report-path "$diagnostic_report" --log-opts="--all" . >"$diagnostic_log" 2>&1
            diagnostic_scan_status=$?
            if [ "$diagnostic_scan_status" -ne 0 ] && [ "$diagnostic_scan_status" -ne 2 ]; then
              echo "Gitleaks diagnostic scan failed with exit code $diagnostic_scan_status"
              exit 1
            fi
            if [ -f "$diagnostic_report" ]; then
              python3 security/validate_gitleaks_allowlists.py --report "$diagnostic_report"
              diagnostic_status=$?
              if [ "$diagnostic_status" -ne 0 ]; then
                exit "$diagnostic_status"
              fi
            else
              echo "Gitleaks diagnostic report was not produced"
              exit 1
            fi
          fi
          exit "$scan_status"
