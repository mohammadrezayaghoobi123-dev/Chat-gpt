name: Independent 9Router PR Review

on:
  push:
    branches:
      - feature/independent-9router-pr-review
      - feature/9router-abc-provenance
    paths:
      - "tools/9router-review/**"
      - ".github/workflows/9router-pr-review.yml"
      - ".github/workflows/9router-pr-review-signal.yml"
  workflow_run:
    workflows:
      - "9Router PR Review Signal"
    types: [completed]

permissions:
  contents: read

jobs:
  contract-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked reviewer dependencies
        run: npm ci --ignore-scripts --prefix tools/9router-review
      - name: Verify npm registry signatures
        run: npm audit signatures --prefix tools/9router-review
      - name: Run reviewer contract tests
        run: node --test tools/9router-review/*.test.mjs

  resolve-signal:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/9router-pr-review-signal.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pull_request: ${{ steps.resolve.outputs.pull_request }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      - name: Checkout trusted default-branch resolver only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Resolve authoritative workflow-run attempt
        id: run-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          RUN_JSON="$RUNNER_TEMP/workflow-run.json"
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > "$RUN_JSON"
          jq -e \
            --argjson run_id "$RUN_ID" \
            --argjson event_run_attempt "$EVENT_RUN_ATTEMPT" \
            --argjson repository_id "$REPOSITORY_ID" \
            --arg repository "$REPOSITORY" \
            --arg run_head_sha "$RUN_HEAD_SHA" \
            --argjson workflow_id "$WORKFLOW_ID" \
            --arg workflow_path "$WORKFLOW_PATH" \
            --arg trigger_event "$TRIGGER_EVENT" \
            --arg conclusion "$WORKFLOW_CONCLUSION" \
            '.id == $run_id and
             .repository.id == $repository_id and .repository.full_name == $repository and
             .head_repository.id == $repository_id and .head_repository.full_name == $repository and
             .head_sha == $run_head_sha and .workflow_id == $workflow_id and
             .path == $workflow_path and .event == $trigger_event and
             .conclusion == $conclusion and
             (.run_attempt | type == "number" and . > 0) and
             .run_attempt == $event_run_attempt' "$RUN_JSON" > /dev/null
          RUN_ATTEMPT="$(jq -er '.run_attempt' "$RUN_JSON")"
          echo "run_attempt=$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Download only the triggering run and API-verified attempt receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 9router-pr-signal-${{ github.event.workflow_run.id }}-${{ steps.run-metadata.outputs.run_attempt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/9router-signal
          digest-mismatch: error
      - name: Validate receipt and independently reconcile GitHub state
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ steps.run-metadata.outputs.run_attempt }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SIGNAL_RECEIPT_PATH: ${{ runner.temp }}/9router-signal/signal.json
        run: node tools/9router-review/resolve-signal.mjs

  review:
    needs: resolve-signal
    if: needs.resolve-signal.result == 'success'
    concurrency:
      group: 9router-pr-review-${{ needs.resolve-signal.outputs.pull_request }}
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      REPOSITORY: ${{ github.repository }}
      PULL_REQUEST_NUMBER: ${{ needs.resolve-signal.outputs.pull_request }}
      EXPECTED_HEAD_SHA: ${{ needs.resolve-signal.outputs.head_sha }}
      EXPECTED_BASE_SHA: ${{ needs.resolve-signal.outputs.base_sha }}
    steps:
      - name: Check reviewer configuration
        id: reviewer-config
        env:
          ROUTER_BASE_URL_CONFIGURED: ${{ secrets.NINE_ROUTER_API_URL != '' }}
          ROUTER_API_KEY_CONFIGURED: ${{ secrets.NINE_ROUTER_API_KEY != '' }}
          REVIEW_MARKER_KEY_CONFIGURED: ${{ secrets.NINE_ROUTER_REVIEW_MARKER_KEY != '' }}
          ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
        run: |
          if [ "$ROUTER_BASE_URL_CONFIGURED" != "true" ] || [ "$ROUTER_API_KEY_CONFIGURED" != "true" ] || [ "$REVIEW_MARKER_KEY_CONFIGURED" != "true" ] || [ -z "$ROUTER_MODEL" ]; then
            echo "::warning::9Router review NOT RUN: required repository configuration is missing."
            echo "9Router review was not run because required configuration is missing." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout trusted default-branch reviewer code only
        if: steps.reviewer-config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js 22
        if: steps.reviewer-config.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked reviewer dependencies
        if: steps.reviewer-config.outputs.ready == 'true'
        run: npm ci --ignore-scripts --prefix tools/9router-review
      - name: Verify npm registry signatures
        if: steps.reviewer-config.outputs.ready == 'true'
        run: npm audit signatures --prefix tools/9router-review
      - name: Run report-only independent review
        if: steps.reviewer-config.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_API_URL }}
          ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          REVIEW_MARKER_KEY: ${{ secrets.NINE_ROUTER_REVIEW_MARKER_KEY }}
          PREVIOUS_REVIEW_MARKER_KEY: ${{ secrets.NINE_ROUTER_REVIEW_MARKER_PREVIOUS_KEY }}
          PREVIOUS_REVIEW_MARKER_KEY_EXPIRES_AT: ${{ vars.NINE_ROUTER_REVIEW_MARKER_PREVIOUS_KEY_EXPIRES_AT }}
          ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
        run: node tools/9router-review/run-review.mjs
