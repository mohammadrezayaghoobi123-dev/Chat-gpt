name: Master Brain MVP tests

on:
  push:
    branches:
      - master-brain/integrated-mvp
      - master-brain/proof-protocol-v0
  pull_request:
    branches:
      - main
      - master-brain/integrated-mvp

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python -m master_brain.demo
