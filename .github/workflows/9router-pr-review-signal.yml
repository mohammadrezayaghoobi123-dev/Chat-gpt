name: 9Router PR Review Signal

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Emit unprivileged PR signal
        run: echo "Unprivileged PR signal completed. No pull-request code or artifacts are checked out or executed."
