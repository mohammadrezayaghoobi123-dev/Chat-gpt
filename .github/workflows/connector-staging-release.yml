name: Connector Staging Release

on:
  push:
    branches:
      - "integration/staging-release-*"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: connector-staging-release
  cancel-in-progress: false

jobs:
  release-staging:
    name: Deploy exact candidate to Staging and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
    defaults:
      run:
        working-directory: cloud-engineering-connector
    env:
      STAGING_MCP_URL: https://chat-gpt111-staging.mohammadrezayaghoobi123.workers.dev
      RELEASE_ENV: staging

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable release branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#integration/staging-release-}"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]] || [[ "$expected" != "$GITHUB_SHA" ]]; then
            echo "::error::Release branch suffix must equal the exact 40-character candidate commit SHA."
            exit 1
          fi
          echo "Candidate SHA validated: $GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify independent approval of the exact Staging candidate
        run: node scripts/verify-release-approval.mjs
        env:
          RELEASE_GITHUB_TOKEN: ${{ github.token }}

      - name: Validate MCP smoke credential
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.MCP_AUTH_TOKEN;
          if (typeof token !== "string" || token.length < 32 || token.length > 512) {
            throw new Error("Set the MCP_AUTH_TOKEN secret in the Staging GitHub environment to the exact Staging Worker bearer token. The value is never logged.");
          }
          console.log("Staging MCP smoke credential is configured.");
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run complete test and configuration gates
        run: |
          npm test
          npm run check

      - name: Preflight Staging bindings and capture rollback target
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync } from "node:fs";

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const root = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/chat-gpt111-staging`;
          async function api(path) {
            const response = await fetch(root + path, {
              headers: { authorization: `Bearer ${token}`, accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            assert.equal(response.ok && body.success, true, `Cloudflare API preflight failed: HTTP ${response.status}`);
            return body.result;
          }
          async function accountSecuritySettings() {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}`, {
              headers: { authorization: `Bearer ${token}`, accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            assert.equal(response.ok && body.success, true, `Cloudflare account security preflight failed: HTTP ${response.status}`);
            return body.result?.settings || {};
          }

          const [settings, deploymentData, accountSecurity] = await Promise.all([
            api("/settings"), api("/deployments?per_page=1&page=1"), accountSecuritySettings(),
          ]);
          assert.equal(accountSecurity.enforce_twofactor, true, "Cloudflare account-level MFA enforcement must be enabled before Staging release");
          const bindings = new Map((settings.bindings || []).map((binding) => [binding.name, binding]));
          const requiredSecrets = ["GITHUB_READONLY_TOKEN", "GITHUB_TOKEN", "MCP_AUTH_TOKEN", "MCP_ALLOWED_ORIGINS"];
          const missing = requiredSecrets.filter((name) => bindings.get(name)?.type !== "secret_text");
          if (missing.length) {
            throw new Error("Staging deployment blocked; missing Worker secret binding(s): " + missing.join(", ") + ". Add them in Cloudflare Workers > chat-gpt111-staging > Settings > Variables and Secrets. Secret values are never read.");
          }
          assert.equal(bindings.get("PUBLIC_READ_ONLY")?.text, "true", "PUBLIC_READ_ONLY must be explicitly true in Staging");
          assert.ok(bindings.get("WRITE_CONTROL")?.namespace_id, "Staging WRITE_CONTROL namespace is required");
          assert.ok(bindings.get("MCP_RATE_LIMITER")?.namespace_id, "Staging MCP_RATE_LIMITER namespace is required");

          const observability = settings.observability;
          assert.equal(observability?.enabled, true, "Staging Worker observability must be enabled");
          assert.equal(observability?.redact_query_string, true, "Staging observability must redact query strings");
          assert.equal(observability?.head_sampling_rate, 1, "Staging observability must sample 100% of custom logs");
          assert.equal(observability?.logs?.enabled, true, "Staging persistent Worker logs must be enabled");
          assert.equal(observability?.logs?.persist, true, "Staging Worker logs must be persisted");
          assert.equal(observability?.logs?.head_sampling_rate, 1, "Staging persistent logs must sample 100%");
          assert.equal(observability?.logs?.invocation_logs, false, "Staging invocation logs must remain disabled to reduce sensitive-data exposure");

          const active = deploymentData.deployments?.[0];
          const previous = active?.versions?.find((version) => version.percentage === 100) || active?.versions?.[0];
          assert.ok(previous?.version_id, "Could not identify the current 100% Staging version for rollback");
          appendFileSync(process.env.GITHUB_OUTPUT, `previous_version_id=${previous.version_id}\n`);
          console.log("Staging binding preflight passed; rollback target captured by immutable version ID.");
          NODE

      - name: Deploy candidate to Staging
        id: deploy
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Staging KnowledgeStore binding and scheduled reconciliation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const root = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/chat-gpt111-staging";
          async function api(path) {
            const response = await fetch(root + path, {
              headers: { authorization: "Bearer " + token, accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            assert.equal(response.ok && body.success, true, "Cloudflare verification failed: HTTP " + response.status);
            return body.result;
          }
          const [settings, schedules] = await Promise.all([api("/settings"), api("/schedules")]);
          const bindings = new Map((settings.bindings || []).map((binding) => [binding.name, binding]));
          const knowledgeStore = bindings.get("KNOWLEDGE_STORE");
          assert.equal(knowledgeStore?.type, "durable_object_namespace", "Staging KNOWLEDGE_STORE Durable Object binding is required");
          assert.ok(knowledgeStore.namespace_id, "Staging KNOWLEDGE_STORE namespace ID must be present");
          const orchestratorLedger = bindings.get("ORCHESTRATOR_LEDGER");
          assert.equal(orchestratorLedger?.type, "durable_object_namespace", "Staging ORCHESTRATOR_LEDGER Durable Object binding is required");
          assert.ok(orchestratorLedger.namespace_id, "Staging ORCHESTRATOR_LEDGER namespace ID must be present");
          assert.ok(
            (schedules.schedules || []).some((schedule) => schedule.cron === "*/5 * * * *"),
            "Staging five-minute Knowledge Store reconciliation Cron must be active",
          );
          console.log("Staging KnowledgeStore binding and five-minute reconciliation Cron are verified.");
          NODE

      - name: Run live Staging acceptance
        id: acceptance
        run: node test/staging-smoke.mjs
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}

      - name: Confirm deployed version and write release evidence
        if: success()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/chat-gpt111-staging/deployments?per_page=1&page=1`;
          const response = await fetch(url, { headers: { authorization: `Bearer ${token}` } });
          const body = await response.json();
          if (!response.ok || !body.success) throw new Error("Could not verify final Staging deployment.");
          const active = body.result.deployments?.[0];
          const version = active?.versions?.find((item) => item.percentage === 100);
          if (!version?.version_id) throw new Error("Staging does not have one active 100% version.");
          console.log(`Staging deployment verified. Candidate=${process.env.GITHUB_SHA}; Version=${version.version_id}; Deployment=${active.id}`);
          NODE

      - name: Roll back Staging if post-deploy acceptance fails
        id: rollback
        if: failure() && steps.deploy.outcome == 'success' && steps.preflight.outputs.previous_version_id != ''
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const previous = process.env.PREVIOUS_VERSION_ID;
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/chat-gpt111-staging/deployments`;
          const response = await fetch(url, {
            method: "POST",
            headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
            body: JSON.stringify({
              strategy: "percentage",
              versions: [{ version_id: previous, percentage: 100 }],
              annotations: { "workers/message": `Automatic Staging rollback after failed acceptance for ${process.env.GITHUB_SHA}` },
            }),
            signal: AbortSignal.timeout(30000),
          });
          const body = await response.json();
          if (!response.ok || !body.success) throw new Error("Automatic rollback failed; manual rollback is required.");
          const verificationUrl = url + "?per_page=1&page=1";
          const verificationResponse = await fetch(verificationUrl, {
            headers: { authorization: "Bearer " + token, accept: "application/json" },
            signal: AbortSignal.timeout(15000),
          });
          const verificationBody = await verificationResponse.json();
          if (!verificationResponse.ok || !verificationBody.success) {
            throw new Error("Staging rollback was requested, but the active deployment could not be verified.");
          }
          const activeDeployment = verificationBody.result?.deployments?.[0];
          const activeVersions = activeDeployment?.versions || [];
          if (
            activeVersions.length !== 1 ||
            activeVersions[0]?.version_id !== previous ||
            activeVersions[0]?.percentage !== 100
          ) {
            throw new Error("Staging rollback was requested, but 100% traffic is not routed to the captured previous version.");
          }
          const [health, readiness] = await Promise.all([
            fetch(new URL("/healthz", process.env.STAGING_MCP_URL), { signal: AbortSignal.timeout(15000) }),
            fetch(new URL("/readyz", process.env.STAGING_MCP_URL), { signal: AbortSignal.timeout(15000) }),
          ]);
          if (!health.ok || !readiness.ok) throw new Error("Rollback was requested but Staging liveness/readiness did not recover.");
          console.log("Staging traffic restored to the captured immutable rollback version.");
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.preflight.outputs.previous_version_id }}

      - name: Write release evidence manifest
        if: always()
        run: node scripts/write-release-evidence.mjs
        env:
          RELEASE_ENV: staging
          WORKER_NAME: chat-gpt111-staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.preflight.outputs.previous_version_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-staging-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-engineering-connector/release-evidence.json
          if-no-files-found: error
          retention-days: 90
