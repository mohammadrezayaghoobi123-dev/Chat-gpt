name: CI diagnose (unit tests on Python 3.11, failures as annotations)

# Read-only. Re-runs the unit-test suite exactly like master-brain-tests.yml but never fails the job;
# every failing test is surfaced as an ::error:: annotation so the cause is readable through the API.
# Runs only when THIS file changes on the integrated branch, or on demand.
on:
  push:
    branches:
      - master-brain/integrated
    paths:
      - .github/workflows/ci-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  MB_REQUIRE_SIGNING_TESTS: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[signing]"
      - name: Versions
        run: |
          python -c "import sys,cryptography;print('::notice::python',sys.version.split()[0],'cryptography',cryptography.__version__)"
      - name: Run suite and surface failures
        run: |
          python -m unittest discover -s tests 2>&1 | tee out.txt || true
          python - <<'PY'
          import re
          text = open("out.txt", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n={70}\n", text)
          bad = [b for b in blocks if b.startswith(("FAIL:", "ERROR:"))]
          tail = text.strip().splitlines()[-3:]
          print("::notice::summary " + " | ".join(tail).replace("\n", " "))
          for b in bad[:12]:
              lines = b.strip().splitlines()
              head = lines[0][:200]
              body = "\n".join(lines[-8:])[:900]
              print("::error::" + (head + "\n" + body).replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          if not bad:
              print("::notice::no FAIL/ERROR blocks found")
          PY
