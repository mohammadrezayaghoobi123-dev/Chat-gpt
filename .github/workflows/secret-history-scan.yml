name: Full History Secret Scan
# Keep secret-bearing diagnostics confined to the ephemeral runner and redact all emitted output.

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: full-history-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    name: Gitleaks PR diff and all fetched refs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan pull request change range
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Verify merge-resolution coverage with pinned Gitleaks
        env:
          GITLEAKS_BIN: /tmp/gitleaks-8.30.1/gitleaks
        run: python3 -m unittest discover -s security/tests -p 'test_gitleaks_merge_diff_integration.py' -v
      - name: Verify fail-closed merge coverage inventory contract
        run: python3 -m unittest discover -s security/tests -p 'test_merge_coverage_inventory.py' -v
      - name: Scan every fetched Git ref and reachable commit
        shell: bash
        env:
          GITLEAKS_BIN: /tmp/gitleaks-8.30.1/gitleaks
          PYTHON_BIN: python3
          VALIDATOR_SCRIPT: security/validate_gitleaks_allowlists.py
          RM_BIN: rm
          GITLEAKS_TIMEOUT_SECONDS: "180"
        run: bash security/run_full_history_secret_scan.sh
