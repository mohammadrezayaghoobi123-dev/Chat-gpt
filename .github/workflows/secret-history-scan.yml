name: Full History Secret Scan
# Keep secret-bearing diagnostics confined to the ephemeral runner and redact all emitted output.

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: full-history-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    name: Gitleaks PR diff and all fetched refs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan pull request change range
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan every fetched Git ref and reachable commit
        shell: bash
        run: |
          set +e
          umask 077
          full_report="$RUNNER_TEMP/gitleaks-full-history-redacted.json"
          necessity_config="$RUNNER_TEMP/gitleaks-necessity-config.toml"
          necessity_report="$RUNNER_TEMP/gitleaks-necessity-report-redacted.json"
          trap 'rm -f "$full_report" "$necessity_config" "$necessity_report"' EXIT
          /tmp/gitleaks-8.30.1/gitleaks git --config .gitleaks.toml --redact --exit-code 2 --report-format json --report-path "$full_report" --log-opts="--all" .
          scan_status=$?
          if [ "$scan_status" -ne 0 ] && [ "$scan_status" -ne 2 ]; then
            echo "Full-history Gitleaks scan failed with exit code $scan_status"
            exit 1
          fi
          python3 security/validate_gitleaks_allowlists.py --necessity-config "$necessity_config"
          config_status=$?
          if [ "$config_status" -ne 0 ]; then exit "$config_status"; fi
          /tmp/gitleaks-8.30.1/gitleaks git --config "$necessity_config" --redact --exit-code 2 --report-format json --report-path "$necessity_report" --log-opts="--all" .
          necessity_scan_status=$?
          if [ "$necessity_scan_status" -ne 2 ]; then
            echo "Necessity scan must produce findings (expected exit code 2); observed $necessity_scan_status"
            exit 1
          fi
          if [ ! -s "$necessity_report" ]; then
            echo "Redacted necessity report missing or empty"
            exit 1
          fi
          python3 security/validate_gitleaks_allowlists.py --necessity-report "$necessity_report"
          proof_status=$?
          if [ "$proof_status" -ne 0 ]; then exit "$proof_status"; fi
          exit "$scan_status"
