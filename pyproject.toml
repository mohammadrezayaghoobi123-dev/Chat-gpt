[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-brain-core"
version = "0.1.0"
description = "Provider-independent deterministic core for the integrated Master Brain MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
observability = ["langfuse>=4.7.0,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
