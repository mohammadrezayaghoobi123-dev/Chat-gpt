name: Cloud Agent CI

on:
  push:
    branches:
      - feature/independent-cloud-agent
      - 'hardening/**'
    paths:
      - "cloud-agent/**"
      - ".github/workflows/cloud-agent-ci.yml"
  pull_request:
    paths:
      - "cloud-agent/**"
      - ".github/workflows/cloud-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Wrangler configuration dry-run
        run: npx --yes wrangler@4.155.0 deploy --dry-run
