name: Controlled Staging deployment

on:
  push:
    branches:
      - "integration/staging-deploy-pr126-*"
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/staging-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloud-engineering-connector-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud-engineering-connector
    env:
      CLOUDFLARE_ACCOUNT_ID: "41fa1ba9c25a8b27ee7378741a633f61"
      STAGING_MCP_URL: "https://chat-gpt111-staging.mohammadrezayaghoobi123.workers.dev"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit dependency advisories
        run: npm audit --audit-level=moderate

      - name: Run complete connector and Durable Object test suites
        run: npm test

      - name: Validate syntax and Wrangler configurations
        run: npm run check

      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured. No deployment was attempted."
            exit 1
          fi

      - name: Require dedicated read-only GitHub credential in Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          secrets_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chat-gpt111-staging/secrets")"
          if ! printf '%s' "$secrets_json" | jq -e '.success == true and any(.result[]; .name == "GITHUB_READONLY_TOKEN" and .type == "secret_text")' >/dev/null; then
            echo "::error::Staging is missing GITHUB_READONLY_TOKEN. Add a fine-grained GitHub token limited to this repository with Contents: Read-only, then retry. No deployment was attempted."
            exit 1
          fi

      - name: Deploy Staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env staging

      - name: Verify deployed Staging MCP, console, protocol, and GitHub read path
        run: node test/staging-smoke.mjs
