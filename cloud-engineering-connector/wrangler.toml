name = "chat-gpt111"
main = "index.js"
compatibility_date = "2026-10-23"
workers_dev = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294163"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "WRITE_CONTROL"
class_name = "WriteControl"

[exports.WriteControl]
type = "durable-object"
storage = "sqlite"

[env.staging]

[env.staging.vars]
ALLOW_GITHUB_TOKEN_READ_FALLBACK = "true"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.staging.observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[[env.staging.ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294164"

[env.staging.ratelimits.simple]
limit = 60
period = 60

[[env.staging.durable_objects.bindings]]
name = "WRITE_CONTROL"
class_name = "WriteControl"

[env.staging.exports.WriteControl]
type = "durable-object"
storage = "sqlite"
