name = "chat-gpt111"
main = "index.js"
compatibility_date = "2026-10-23"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
OAUTH_ISSUER = "https://chat-gpt111.mohammadrezayaghoobi123.workers.dev"
MCP_RESOURCE_URL = "https://chat-gpt111.mohammadrezayaghoobi123.workers.dev/mcp"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "3cc3207de5754d7cb968be0df9604cac"

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294163"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "KNOWLEDGE_STORE"
class_name = "KnowledgeStore"

[[durable_objects.bindings]]
name = "ORCHESTRATOR_LEDGER"
class_name = "OrchestratorLedger"

[[durable_objects.bindings]]
name = "TENANT_DIRECTORY"
class_name = "TenantDirectory"

[exports.KnowledgeStore]
type = "durable-object"
storage = "sqlite"

[exports.OrchestratorLedger]
type = "durable-object"
storage = "sqlite"

[exports.TenantDirectory]
type = "durable-object"
storage = "sqlite"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.staging.observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[env.staging.observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[env.staging.vars]
OAUTH_ISSUER = "https://chat-gpt111-staging.mohammadrezayaghoobi123.workers.dev"
MCP_RESOURCE_URL = "https://chat-gpt111-staging.mohammadrezayaghoobi123.workers.dev/mcp"

[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "4a2b689d12f34f3e8348720c0637589d"

[[env.staging.ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294164"

[env.staging.ratelimits.simple]
limit = 60
period = 60

[[env.staging.durable_objects.bindings]]
name = "KNOWLEDGE_STORE"
class_name = "KnowledgeStore"

[[env.staging.durable_objects.bindings]]
name = "ORCHESTRATOR_LEDGER"
class_name = "OrchestratorLedger"

[[env.staging.durable_objects.bindings]]
name = "TENANT_DIRECTORY"
class_name = "TenantDirectory"

[[env.staging.durable_objects.bindings]]
name = "WRITE_CONTROL"
class_name = "WriteControl"

[env.staging.exports.KnowledgeStore]
type = "durable-object"
storage = "sqlite"

[env.staging.exports.OrchestratorLedger]
type = "durable-object"
storage = "sqlite"

[env.staging.exports.TenantDirectory]
type = "durable-object"
storage = "sqlite"

[env.staging.exports.WriteControl]
type = "durable-object"
storage = "sqlite"
