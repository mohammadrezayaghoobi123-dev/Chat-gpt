name: CI fetch failure context (diagnostic, read-only)

# Reads the log of given job ids from inside GitHub and re-emits the lines around thread exceptions /
# connection errors as annotations (the earlier workflow only emitted the unittest FAIL block).
on:
  push:
    branches:
      - ci/flake-stress-2026-10-28
    paths:
      - .github/workflows/ci-fetch-context.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and surface context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p logs
          for id in 123419420982; do
            curl -sSL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" -o "logs/$id.txt" 2> "logs/$id.err" || echo "::warning::fetch failed for $id: $(head -c 300 logs/$id.err)"
            echo "::notice::job $id log bytes: $(wc -c < logs/$id.txt)"
          done
          python3 - <<'PY'
          import glob, re, os
          def esc(s): return s.replace("%","%25").replace("\r","").replace("\n","%0A")
          for path in sorted(glob.glob("logs/*.txt")):
              jid = os.path.basename(path)[:-4]
              text = open(path, encoding="utf-8", errors="replace").read()
              lines = [re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", re.sub(r"^\d{4}-\d\d-\d\dT[\d:.]+Z ", "", l)) for l in text.splitlines()]
              print("::notice::job %s: %d lines" % (jid, len(lines)))
              idx = [i for i, l in enumerate(lines) if re.search(r"Exception in thread|Traceback|ConnectionResetError|ConnectionRefusedError|BrokenPipe|timed out|RemoteDisconnected|URLError|http\.client", l)]
              print("::notice::job %s: %d matching line indexes: %s" % (jid, len(idx), idx[:30]))
              seen = set()
              for i in idx[:6]:
                  if i in seen: continue
                  chunk = lines[max(0, i-2):i+14]
                  seen.update(range(i, i+14))
                  print("::error::job %s @%d: %s" % (jid, i, esc("\n".join(chunk)[:1900])))
              if jid == '120849868742':
                  w = [l.strip() for l in lines[768:800] if l.strip()]
                  print('::error::window768-800: ' + esc(' ¦ '.join(w)[:1900]))
                  errs = [l.strip() for l in lines if re.search(r'^\w*(Error|Exception)\b|^(http|socket|urllib|ConnectionR|Remote|Broken|OSError|TimeoutError)', l.strip())]
                  print('::error::error-lines: ' + esc(' ¦ '.join(errs[:20])[:1900]))
              sk=[l for l in lines if re.search(r'skipped|SKIP|Skipped|sandbox|MB_REQUIRE', l)]
              print('::notice::skip-related lines (%d): %s' % (len(sk), esc(' ¦ '.join(x.strip() for x in sk[:25])[:1800])))
              # also: slowest tests / timing lines
              t = [l for l in lines if re.match(r"^(Ran |FAILED|OK)", l)]
              print("::notice::job %s: summary %s" % (jid, " | ".join(t)))
          PY
