name: Master Brain MCP CI

on:
  push:
    branches:
      - feature/master-brain-cloud-mcp
    paths:
      - "master-brain-mcp/**"
      - ".github/workflows/master-brain-mcp.yml"
  pull_request:
    paths:
      - "master-brain-mcp/**"
      - ".github/workflows/master-brain-mcp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master-brain-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Exercise HTTP and MCP endpoints
        run: npm test
