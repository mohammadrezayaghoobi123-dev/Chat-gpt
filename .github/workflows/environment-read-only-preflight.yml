name: GitHub Environment Read-Only Preflight

on:
  push:
    branches:
      - "security/environment-read-only-preflight-*"
      - "security/environment-branch-policy-state-disambiguation-*"

permissions:
  actions: read
  contents: read

concurrency:
  group: environment-read-only-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only Staging and Production Environment audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - name: Checkout audit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Audit live GitHub Environment protection metadata
        run: node scripts/audit-environment-protection.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
