name: Full History Secret Scan

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    name: Gitleaks current diff and all fetched refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan changed commits with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan every fetched Git ref and commit
        shell: bash
        run: |
          set +e
          /tmp/gitleaks-8.30.1/gitleaks git --redact --exit-code 2 --report-format json --report-path "$RUNNER_TEMP/gitleaks-full-history.json" --log-opts="--all" .
          scan_status=$?
          if [ -f "$RUNNER_TEMP/gitleaks-full-history.json" ]; then
            jq -r '.[] | [.Description, .File, (.StartLine|tostring), (.EndLine|tostring), .Commit, .RuleID, .Author, .Date] | @tsv' "$RUNNER_TEMP/gitleaks-full-history.json"
          fi
          exit "$scan_status"
