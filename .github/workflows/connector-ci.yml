name: Cloud Engineering Connector CI

on:
  pull_request:
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"
  push:
    branches:
      - "feature/cloud-engineering-connector"
      - "release/production"
      - "assistant/**"
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"

permissions:
  contents: read

concurrency:
  group: connector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: "22"
      - name: Pin npm CLI for deterministic dependency resolution
        run: npm install --global npm@11.21.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive committed package lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: connector-package-lock-${{ github.sha }}
          path: cloud-engineering-connector/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
