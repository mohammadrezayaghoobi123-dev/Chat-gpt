name: Generate dependency lockfiles (one-shot)

on:
  push:
    branches:
      - security/project-security-hardening
    paths:
      - .github/workflows/generate-lockfiles-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate package lockfiles without executing install scripts
        run: |
          cd cloud-agent
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          cd ../cloud-engineering-connector
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-agent/package-lock.json cloud-engineering-connector/package-lock.json
          git rm .github/workflows/generate-lockfiles-once.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git commit -m "build: add deterministic npm lockfiles"
          git push origin HEAD:security/project-security-hardening
