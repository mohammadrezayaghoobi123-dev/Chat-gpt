name: Connector Production Release

on:
  push:
    branches:
      - "integration/production-release-*"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: connector-production-release
  cancel-in-progress: false

jobs:
  release-production:
    name: Deploy exact candidate to Production and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
    defaults:
      run:
        working-directory: cloud-engineering-connector
    env:
      PRODUCTION_MCP_URL: https://chat-gpt111.mohammadrezayaghoobi123.workers.dev
      RELEASE_ENV: production

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable release branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#integration/production-release-}"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]] || [[ "$expected" != "$GITHUB_SHA" ]]; then
            echo "::error::Release branch suffix must equal the exact 40-character candidate commit SHA."
            exit 1
          fi
          echo "Candidate SHA validated: $GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify independently approved merged Production candidate
        run: node scripts/verify-release-approval.mjs
        env:
          RELEASE_GITHUB_TOKEN: ${{ github.token }}

      - name: Validate MCP smoke credential
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.MCP_AUTH_TOKEN;
          if (typeof token !== "string" || token.length < 32 || token.length > 512) {
            throw new Error("Set the MCP_AUTH_TOKEN secret in the Production GitHub environment to the exact Production Worker bearer token. The value is never logged.");
          }
          console.log("Production MCP smoke credential is configured.");
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run complete test and configuration gates
        run: |
          npm test
          npm run check

      - name: Preflight Production credentials, namespace isolation, and rollback target
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync } from "node:fs";

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const root = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts`;
          async function api(script, path) {
            const response = await fetch(`${root}/${script}${path}`, {
              headers: { authorization: `Bearer ${token}`, accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            assert.equal(response.ok && body.success, true, `Cloudflare API preflight failed: HTTP ${response.status}`);
            return body.result;
          }
          async function accountSecuritySettings() {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}`, {
              headers: { authorization: `Bearer ${token}`, accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            assert.equal(response.ok && body.success, true, `Cloudflare account security preflight failed: HTTP ${response.status}`);
            return body.result?.settings || {};
          }

          const [productionSettings, stagingSettings, deploymentData, accountSecurity] = await Promise.all([
            api("chat-gpt111", "/settings"),
            api("chat-gpt111-staging", "/settings"),
            api("chat-gpt111", "/deployments?per_page=1&page=1"),
            accountSecuritySettings(),
          ]);
          assert.equal(accountSecurity.enforce_twofactor, true, "Cloudflare account-level MFA enforcement must be enabled before Production release");
          const productionBindings = new Map((productionSettings.bindings || []).map((binding) => [binding.name, binding]));
          const stagingBindings = new Map((stagingSettings.bindings || []).map((binding) => [binding.name, binding]));

          const requiredSecrets = ["GITHUB_READONLY_TOKEN", "GITHUB_TOKEN", "MCP_AUTH_TOKEN", "MCP_ALLOWED_ORIGINS"];
          const missing = requiredSecrets.filter((name) => productionBindings.get(name)?.type !== "secret_text");
          if (missing.length) {
            throw new Error("Production deployment blocked; missing Worker secret binding(s): " + missing.join(", ") + ". Add them in Cloudflare Workers > chat-gpt111 > Settings > Variables and Secrets. Secret values are never read.");
          }

          const productionLimiter = productionBindings.get("MCP_RATE_LIMITER");
          const stagingLimiter = stagingBindings.get("MCP_RATE_LIMITER");
          assert.ok(productionLimiter?.namespace_id && stagingLimiter?.namespace_id, "Both Production and Staging MCP_RATE_LIMITER namespaces are required");
          assert.notEqual(productionLimiter.namespace_id, stagingLimiter.namespace_id, "Production and Staging rate-limit namespaces must be isolated");

          const existingProductionWriteControl = productionBindings.get("WRITE_CONTROL");
          const stagingWriteControl = stagingBindings.get("WRITE_CONTROL");
          assert.ok(stagingWriteControl?.namespace_id, "Staging WRITE_CONTROL namespace is required");
          if (existingProductionWriteControl) {
            assert.equal(existingProductionWriteControl.type, "durable_object_namespace");
            assert.notEqual(existingProductionWriteControl.namespace_id, stagingWriteControl.namespace_id, "Production and Staging Durable Object namespaces must be isolated");
          }
          // First Production deployment creates WRITE_CONTROL through the checked-in SQLite migration.
          const active = deploymentData.deployments?.[0];
          const versions = active?.versions || [];
          assert.equal(versions.length, 1, "Production rollback target must have exactly one active version");
          const previous = versions[0];
          assert.equal(previous?.percentage, 100, "Production rollback target must receive exactly 100% traffic");
          assert.ok(previous?.version_id, "Could not identify the current 100% Production version for rollback");
          appendFileSync(process.env.GITHUB_OUTPUT, `previous_version_id=${previous.version_id}\n`);
          console.log("Production preflight passed; isolated namespace checks passed; immutable rollback target captured.");
          NODE

      - name: Deploy candidate to Production
        id: deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Production Durable Object namespace isolation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          async function settings(script) {
            const url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/" + script + "/settings";
            const response = await fetch(url, {
              headers: { authorization: "Bearer " + token, accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            assert.equal(response.ok && body.success, true, "Could not inspect " + script + " settings");
            return body.result;
          }
          async function schedules(script) {
            const url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/" + script + "/schedules";
            const response = await fetch(url, {
              headers: { authorization: "Bearer " + token, accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            assert.equal(response.ok && body.success, true, "Could not inspect " + script + " Cron schedules");
            return body.result;
          }
          const [productionSettings, stagingSettings, productionSchedules, stagingSchedules] = await Promise.all([
            settings("chat-gpt111"),
            settings("chat-gpt111-staging"),
            schedules("chat-gpt111"),
            schedules("chat-gpt111-staging"),
          ]);
          const production = new Map((productionSettings.bindings || []).map((binding) => [binding.name, binding]));
          const staging = new Map((stagingSettings.bindings || []).map((binding) => [binding.name, binding]));
          const publicReadOnly = production.get("PUBLIC_READ_ONLY");
          assert.equal(publicReadOnly?.type, "plain_text", "Production PUBLIC_READ_ONLY must be plain-text after deployment");
          assert.equal(publicReadOnly.text, "true", "Production PUBLIC_READ_ONLY must be true after deployment");
          const observability = productionSettings.observability;
          assert.equal(observability?.enabled, true, "Production Worker observability must be enabled after deployment");
          assert.equal(observability?.redact_query_string, true, "Production observability must redact query strings");
          assert.equal(observability?.head_sampling_rate, 1, "Production observability must sample 100% of custom logs");
          assert.equal(observability?.logs?.enabled, true, "Production persistent Worker logs must be enabled");
          assert.equal(observability?.logs?.persist, true, "Production Worker logs must be persisted");
          assert.equal(observability?.logs?.head_sampling_rate, 1, "Production persistent logs must sample 100%");
          assert.equal(observability?.logs?.invocation_logs, false, "Production invocation logs must remain disabled to reduce sensitive-data exposure");
          assert.ok(production.get("WRITE_CONTROL")?.namespace_id, "Production migration did not create WRITE_CONTROL");
          assert.notEqual(production.get("WRITE_CONTROL").namespace_id, staging.get("WRITE_CONTROL")?.namespace_id, "Production and Staging WriteControl namespaces must differ");
          const productionKnowledgeStore = production.get("KNOWLEDGE_STORE");
          const stagingKnowledgeStore = staging.get("KNOWLEDGE_STORE");
          assert.equal(productionKnowledgeStore?.type, "durable_object_namespace", "Production KNOWLEDGE_STORE binding is required");
          assert.equal(stagingKnowledgeStore?.type, "durable_object_namespace", "Staging KNOWLEDGE_STORE binding is required");
          assert.ok(productionKnowledgeStore.namespace_id && stagingKnowledgeStore.namespace_id, "Both KnowledgeStore namespace IDs must be present");
          assert.notEqual(productionKnowledgeStore.namespace_id, stagingKnowledgeStore.namespace_id, "Production and Staging KnowledgeStore namespaces must differ");
          const productionLedger = production.get("ORCHESTRATOR_LEDGER");
          const stagingLedger = staging.get("ORCHESTRATOR_LEDGER");
          assert.equal(productionLedger?.type, "durable_object_namespace", "Production ORCHESTRATOR_LEDGER binding is required");
          assert.equal(stagingLedger?.type, "durable_object_namespace", "Staging ORCHESTRATOR_LEDGER binding is required");
          assert.ok(productionLedger.namespace_id && stagingLedger.namespace_id, "Both OrchestratorLedger namespace IDs must be present");
          assert.notEqual(productionLedger.namespace_id, stagingLedger.namespace_id, "Production and Staging OrchestratorLedger namespaces must differ");
          assert.ok((productionSchedules.schedules || []).some((schedule) => schedule.cron === "*/5 * * * *"), "Production five-minute Knowledge Store reconciliation Cron must be active");
          assert.ok((stagingSchedules.schedules || []).some((schedule) => schedule.cron === "*/5 * * * *"), "Staging five-minute Knowledge Store reconciliation Cron must be active");
          assert.notEqual(production.get("MCP_RATE_LIMITER")?.namespace_id, staging.get("MCP_RATE_LIMITER")?.namespace_id, "Production and Staging rate-limit namespaces must differ");
          console.log("Production observability, KnowledgeStore isolation, and five-minute Cron schedules are verified.");
          NODE

      - name: Run live Production acceptance
        id: acceptance
        run: node test/production-smoke.mjs
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}

      - name: Verify deployed version before finalizing release
        if: success()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/chat-gpt111/deployments?per_page=1&page=1`;
          const response = await fetch(url, { headers: { authorization: `Bearer ${token}`, accept: "application/json" }, signal: AbortSignal.timeout(15000) });
          const body = await response.json();
          if (!response.ok || !body.success) throw new Error("Could not verify final Production deployment.");
          const active = body.result.deployments?.[0];
          const versions = active?.versions || [];
          if (versions.length !== 1 || versions[0]?.percentage !== 100 || !versions[0]?.version_id) {
            throw new Error("Production must have exactly one active version receiving 100% traffic.");
          }
          console.log(`Production active deployment verified. Version=${versions[0].version_id}; Deployment=${active.id}`);
          NODE

      - name: Roll back Production if post-deploy acceptance fails
        id: rollback
        if: failure() && steps.deploy.outcome == 'success' && steps.preflight.outputs.previous_version_id != ''
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const previous = process.env.PREVIOUS_VERSION_ID;
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/chat-gpt111/deployments`;
          const response = await fetch(url, {
            method: "POST",
            headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
            body: JSON.stringify({
              strategy: "percentage",
              versions: [{ version_id: previous, percentage: 100 }],
              annotations: { "workers/message": `Automatic Production rollback after failed acceptance for ${process.env.GITHUB_SHA}` },
            }),
            signal: AbortSignal.timeout(30000),
          });
          const body = await response.json();
          if (!response.ok || !body.success) throw new Error("Automatic Production rollback failed; manual rollback is required.");
          const verificationUrl = url + "?per_page=1&page=1";
          const verificationResponse = await fetch(verificationUrl, {
            headers: { authorization: "Bearer " + token, accept: "application/json" },
            signal: AbortSignal.timeout(15000),
          });
          const verificationBody = await verificationResponse.json();
          if (!verificationResponse.ok || !verificationBody.success) {
            throw new Error("Production rollback was requested, but the active deployment could not be verified.");
          }
          const activeDeployment = verificationBody.result?.deployments?.[0];
          const activeVersions = activeDeployment?.versions || [];
          if (
            activeVersions.length !== 1 ||
            activeVersions[0]?.version_id !== previous ||
            activeVersions[0]?.percentage !== 100
          ) {
            throw new Error("Production rollback was requested, but 100% traffic is not routed to the captured previous version.");
          }
          // The pre-release Production Worker may predate /readyz and the Durable Object migration.
          const health = await fetch(new URL("/healthz", process.env.PRODUCTION_MCP_URL), { signal: AbortSignal.timeout(15000) });
          if (!health.ok) throw new Error("Rollback was requested but Production liveness did not recover.");
          console.log("Production traffic restored to the captured immutable rollback version.");
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.preflight.outputs.previous_version_id }}

      - name: Write release evidence manifest
        if: always()
        run: node scripts/write-release-evidence.mjs
        env:
          RELEASE_ENV: production
          WORKER_NAME: chat-gpt111
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.preflight.outputs.previous_version_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-production-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-engineering-connector/release-evidence.json
          if-no-files-found: error
          retention-days: 90
