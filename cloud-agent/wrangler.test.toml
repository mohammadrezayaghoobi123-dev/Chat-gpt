name = "master-brain-cloud-agent-test"
main = "src/worker.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[durable_objects.bindings]]
name = "AGENT_SESSIONS"
class_name = "AgentSession"

[[durable_objects.bindings]]
name = "AGENT_BUDGET"
class_name = "AgentBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentBudget"]
