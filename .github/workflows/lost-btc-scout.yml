name: Lost BTC Scout

on:
  workflow_call:
  pull_request:
    paths:
      - "lost-btc-scout/**"
      - ".github/workflows/lost-btc-scout.yml"
  push:
    branches:
      - "feature/lost-btc-scout"
    paths:
      - "lost-btc-scout/**"
      - ".github/workflows/lost-btc-scout.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run exact-unit regression tests
        working-directory: lost-btc-scout
        run: npm test
      - name: Check formatter syntax
        working-directory: lost-btc-scout
        run: npm run check
