name: Master Brain MVP tests

on:
  workflow_call:
  push:
    branches:
      - master-brain/integrated-mvp
      - master-brain/proof-protocol-v0
      - master-brain/integrated
      - "assistant/**"
  workflow_dispatch:

concurrency:
  group: master-brain-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MB_REQUIRE_SIGNING_TESTS: "1"
  MB_REQUIRE_SANDBOX_TESTS: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Allow unprivileged user namespaces (needed by the CTP runner sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user --net --pid --fork --mount-proc true && echo "::notice::user namespaces usable"
      - name: Install package
        run: python -m pip install -e ".[signing]"
      - name: Run unit tests
        shell: bash   # pipefail: the job still fails exactly when the tests fail
        run: python -m unittest discover -s tests -v 2>&1 | tee unittest-out.txt
      - name: Kernel-enforced limits (cgroup + size-limited tmpfs; needs root, so run under sudo)
        shell: bash
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" PYTHONPATH=src MB_REQUIRE_CGROUP_TESTS=1 \
            python -m unittest -v tests.test_ctp_runner.SeccompFilter tests.test_ctp_runner.KernelEnforcement 2>&1 | tee kernel-out.txt
          if grep -q "skipped" kernel-out.txt; then
            echo "::error::kernel-enforcement tests were skipped"
            exit 1
          fi
      - name: Surface failing tests as annotations (diagnostic only; does not change the result)
        if: failure()
        run: |
          python - <<'PY'
          import re
          text = open("unittest-out.txt", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n={70}\n", text)
          bad = [b for b in blocks if b.startswith(("FAIL:", "ERROR:"))]
          tail = text.strip().splitlines()[-3:]
          print("::notice::summary " + " | ".join(tail))
          for b in bad[:12]:
              lines = b.strip().splitlines()
              body = "\n".join([lines[0][:200]] + lines[-8:])[:900]
              print("::error::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          if not bad:
              print("::notice::no FAIL/ERROR blocks found; last lines: " + " | ".join(text.strip().splitlines()[-6:])[:600])
          PY
      - name: Run offline demo
        run: python -m master_brain.demo
