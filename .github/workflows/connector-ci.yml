name: Cloud Engineering Connector CI

on:
  pull_request:
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"
  push:
    branches:
      - "feature/cloud-engineering-connector"
      - "release/production"
      - "assistant/**"
      - "security/**"
      - "integration/**"
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"

permissions:
  contents: read

concurrency:
  group: connector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit npm dependency advisories
        run: npm audit --audit-level=moderate
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax and Wrangler configurations
        run: npm run check

  post-deploy-staging-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/staging-postdeploy-acceptance-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_MCP_URL: https://chat-gpt111-staging.mohammadrezayaghoobi123.workers.dev
    steps:
      - name: Verify deployed Staging HTTP and authentication contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = process.env.STAGING_MCP_URL;
          assert.ok(base?.startsWith('https://'), 'STAGING_MCP_URL must use HTTPS');

          const health = await fetch(new URL('/healthz', base), { signal: AbortSignal.timeout(15000) });
          assert.equal(health.status, 200, 'GET /healthz must return HTTP 200');
          const healthBody = await health.json();
          assert.equal(healthBody.status, 'ok');
          assert.equal(healthBody.service, 'cloud-engineering-connector');
          assert.equal(healthBody.execution, 'cloudflare-workers');
          assert.equal(healthBody.laptop_dependency, false);
          for (const [header, expected] of [
            ['x-content-type-options', 'nosniff'],
            ['x-frame-options', 'DENY'],
            ['referrer-policy', 'no-referrer'],
            ['cache-control', 'no-store'],
          ]) assert.equal(health.headers.get(header), expected, `security header ${header}`);

          const getMcp = await fetch(new URL('/mcp', base), { signal: AbortSignal.timeout(15000) });
          assert.equal(getMcp.status, 405, 'GET /mcp must be rejected');
          assert.match(getMcp.headers.get('allow') ?? '', /POST/);

          const rpc = {
            jsonrpc: '2.0',
            id: 99001,
            method: 'tools/list',
            params: {},
          };
          const denied = await fetch(new URL('/mcp', base), {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              accept: 'application/json, text/event-stream',
              authorization: 'Bearer deliberately-invalid-post-deploy-probe',
            },
            body: JSON.stringify(rpc),
            signal: AbortSignal.timeout(15000),
          });
          assert.equal(denied.status, 401, 'invalid bearer token must be rejected with HTTP 401');
          assert.equal(denied.headers.get('www-authenticate'), 'Bearer');
          const denialBody = await denied.json();
          assert.equal(denialBody.error, 'unauthorized');

          console.log(JSON.stringify({
            result: 'PASS',
            staging: new URL(base).host,
            checks: [
              'healthz HTTP 200 and cloud-only service metadata',
              'security response headers',
              'GET /mcp rejected with HTTP 405',
              'POST /mcp rejects invalid bearer token with HTTP 401',
            ],
            credentialMaterialLogged: false,
          }, null, 2));
          NODE

      - name: Verify authenticated MCP initialize, tools/list, and read-only tools/call
        env:
          STAGING_MCP_AUTH_TOKEN: ${{ secrets.STAGING_MCP_AUTH_TOKEN }}
          STAGING_MCP_URL: https://chat-gpt111-staging.mohammadrezayaghoobi123.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const token = process.env.STAGING_MCP_AUTH_TOKEN;
          if (!token) {
            console.log('SKIP: STAGING_MCP_AUTH_TOKEN is not configured in GitHub Actions secrets.');
            process.exit(0);
          }
          assert.ok(token.length >= 32 && token.length <= 512, 'Staging token length is outside the server contract');
          const base = process.env.STAGING_MCP_URL;
          async function rpc(id, method, params) {
            const response = await fetch(new URL('/mcp', base), {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                accept: 'application/json, text/event-stream',
                authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ jsonrpc: '2.0', id, method, params }),
              signal: AbortSignal.timeout(15000),
            });
            assert.equal(response.status, 200, `${method} must return HTTP 200`);
            const body = await response.json();
            assert.equal(body.jsonrpc, '2.0');
            assert.equal(body.id, id);
            assert.ok(body.result, `${method} must return a JSON-RPC result`);
            return body.result;
          }

          const initialized = await rpc(99002, 'initialize', {
            protocolVersion: '2025-11-25',
            capabilities: {},
            clientInfo: { name: 'staging-acceptance', version: '1.0.0' },
          });
          assert.equal(initialized.protocolVersion, '2025-11-25');
          assert.equal(initialized.serverInfo?.name, 'cloud-engineering-connector');

          const listed = await rpc(99003, 'tools/list', {});
          assert.ok(Array.isArray(listed.tools));
          assert.ok(listed.tools.some(tool => tool.name === 'engineering_standards'));

          const called = await rpc(99004, 'tools/call', {
            name: 'engineering_standards',
            arguments: {},
          });
          assert.notEqual(called.isError, true);
          assert.ok(Array.isArray(called.content) && called.content.some(item => item.type === 'text' && item.text.length > 0));

          console.log(JSON.stringify({
            result: 'PASS',
            checks: ['authenticated initialize', 'authenticated tools/list', 'authenticated engineering_standards tools/call'],
            credentialMaterialLogged: false,
          }, null, 2));
          NODE
