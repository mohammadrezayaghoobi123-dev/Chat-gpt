name: Cloud Agent CI

on:
  push:
    branches:
      - feature/independent-cloud-agent
      - 'hardening/**'
      - 'security/**'
      - 'integration/**'
    paths:
      - "cloud-agent/**"
      - ".github/workflows/cloud-agent-ci.yml"
  pull_request:
    paths:
      - "cloud-agent/**"
      - ".github/workflows/cloud-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned test dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Audit npm dependency advisories
        run: npm audit --audit-level=moderate
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Wrangler configuration dry-run
        run: npx --yes wrangler@4.155.0 deploy --dry-run
