name: OAuth dependency lockfile bootstrap

on:
  push:
    branches:
      - integration/multi-tenant-migration-2026-11-08
    paths:
      - ".github/workflows/oauth-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Resolve pinned OAuth provider and generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact @cloudflare/workers-oauth-provider@1.2.4
      - name: Verify lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency manifests to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(auth): pin Cloudflare OAuth provider 1.2.4"
            git push origin HEAD:refs/heads/integration/multi-tenant-migration-2026-11-08
          fi
