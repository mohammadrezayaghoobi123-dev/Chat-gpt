name: Publish CTP Evidence Lab

on:
  push:
    branches:
      - feature/ctp-evidence-demo-public
    paths:
      - "public-demos/ctp-evidence-lab/**"
      - ".github/workflows/publish-ctp-evidence-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ctp-evidence-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the CTP demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-demos/ctp-evidence-lab
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
