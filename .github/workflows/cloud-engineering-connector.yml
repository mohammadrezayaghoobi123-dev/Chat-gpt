name: Cloud Engineering Connector CI

on:
  push:
    branches: ["feature/cloud-engineering-connector"]
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/cloud-engineering-connector.yml"
  pull_request:
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/cloud-engineering-connector.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
