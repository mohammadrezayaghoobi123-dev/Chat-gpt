name = "chat-gpt111"
main = "worker.js"
compatibility_date = "2026-10-23"
workers_dev = true

[vars]
SERVICE_MODE = "cloud"

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294163"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]\nname = "WRITE_CONTROL"\nclass_name = "WriteControl"\n\n[[migrations]]\ntag = "v1"\nnew_sqlite_classes = ["WriteControl"]\n\n[env.staging.vars]
SERVICE_MODE = "cloud"

[[env.staging.ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294164"

[env.staging.ratelimits.simple]
limit = 60
period = 60
