name: Independent 9Router PR Review

on:
  push:
    branches:
      - feature/independent-9router-pr-review
    paths:
      - "tools/9router-review/**"
      - ".github/workflows/9router-pr-review.yml"
      - ".github/workflows/9router-pr-review-signal.yml"
  workflow_run:
    workflows:
      - "9Router PR Review Signal"
    types: [completed]

permissions:
  contents: read


jobs:
  contract-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run reviewer contract tests
        run: node --test tools/9router-review/review.test.mjs

  review:
    concurrency:
      group: 9router-pr-review-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
      queue: max
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/9router-pr-review-signal.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_API_URL }}
      ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
      ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
      REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
      TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
      WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check reviewer configuration
        if: env.ROUTER_BASE_URL == '' || env.ROUTER_API_KEY == '' || env.ROUTER_MODEL == ''
        run: |
          echo "::warning::9Router review NOT RUN: repository secrets NINE_ROUTER_API_URL and NINE_ROUTER_API_KEY and variable NINE_ROUTER_MODEL are required."
          echo "9Router review was not run because the endpoint, API key, or model is not configured." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout trusted default-branch reviewer code only
        if: env.ROUTER_BASE_URL != '' && env.ROUTER_API_KEY != '' && env.ROUTER_MODEL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run report-only independent review
        if: env.ROUTER_BASE_URL != '' && env.ROUTER_API_KEY != '' && env.ROUTER_MODEL != ''
        run: node tools/9router-review/run-review.mjs
