name: Unicode 18.0.0 Raw-Byte Acquisition Audit

# Push-only execution is branch-scoped; main remains untouched.
on:
  push:
    branches:
      - "integration/master-brain-unification-2026-11-15"
      - "work/r1u12b-raw-structure-metrics-2026-11-23"
    paths:
      - ".github/workflows/unicode18-raw-byte-acquisition.yml"

permissions: {}

concurrency:
  group: unicode18-raw-byte-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-compare:
    name: Acquire official UCD bytes and compare ZIP members
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Run bounded integrity checks and dual-path acquisition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          import time
          import unittest
          import urllib.error
          import urllib.parse
          import urllib.request
          import ssl
          import zipfile
          from datetime import datetime, timezone
          from io import BytesIO

          VERSION = "18.0.0"
          ROOT = "https://www.unicode.org/Public/18.0.0/ucd/"
          ARCHIVE_URL = ROOT + "UCD.zip"
          REQUIRED = (
              "ReadMe.txt",
              "PropList.txt",
              "DerivedCoreProperties.txt",
              "DerivedAge.txt",
              "extracted/DerivedGeneralCategory.txt",
              "UnicodeData.txt",
              "CaseFolding.txt",
              "DerivedNormalizationProps.txt",
              "NormalizationTest.txt",
          )
          MAX_ARCHIVE = 40 * 1024 * 1024
          MAX_FILE = 25 * 1024 * 1024
          MAX_TOTAL = 100 * 1024 * 1024
          MAX_RATIO = 500
          ALLOWED_TYPES = {
              "text/plain",
              "application/zip",
              "application/octet-stream",
              "application/x-zip-compressed",
          }

          TLS_CONTEXT = ssl.create_default_context()
          TLS_CONTEXT.minimum_version = ssl.TLSVersion.TLSv1_2
          if TLS_CONTEXT.verify_mode != ssl.CERT_REQUIRED or not TLS_CONTEXT.check_hostname:
              raise RuntimeError("TLS certificate and hostname verification are not enabled")
          HTTPS_OPENER = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=TLS_CONTEXT)
          )

          def validate_content_length(declared, received):
              if declared is None:
                  return None
              try:
                  expected = int(declared)
              except (TypeError, ValueError) as exc:
                  raise ValueError("invalid Content-Length header") from exc
              if expected < 0 or expected != received:
                  raise ValueError("Content-Length does not match received bytes")
              return True

          def execution_environment():
              return {
                  "github_run_id": os.environ.get("GITHUB_RUN_ID", "UNKNOWN"),
                  "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "UNKNOWN"),
                  "github_sha": os.environ.get("GITHUB_SHA", "UNKNOWN"),
                  "github_ref": os.environ.get("GITHUB_REF", "UNKNOWN"),
                  "github_workflow": os.environ.get("GITHUB_WORKFLOW", "UNKNOWN"),
                  "runner_os": os.environ.get("RUNNER_OS", "UNKNOWN"),
                  "runner_arch": os.environ.get("RUNNER_ARCH", "UNKNOWN"),
                  "image_os": os.environ.get("ImageOS", "NOT_EXPOSED"),
                  "image_version": os.environ.get("ImageVersion", "NOT_EXPOSED"),
                  "cloud_provider": "NOT_CAPTURED_IN_STEP_ENVIRONMENT; SEE_RUNNER_PROVISIONING_LOG",
              }

          def emit_report(report):
              encoded = json.dumps(report, ensure_ascii=True, sort_keys=True, indent=2)
              print("UNICODE18_ACQUISITION_REPORT_BEGIN")
              print(encoded)
              print("UNICODE18_ACQUISITION_REPORT_END")
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if not summary_path:
                  return
              environment = report.get("execution_environment", {})
              lines = [
                  "## Unicode 18.0.0 raw-byte acquisition report",
                  "",
                  "- Status: **" + str(report.get("status", "UNKNOWN")) + "**",
                  "- Acquired at (UTC): " + str(report.get("acquired_at_utc", "NOT_COMPLETED")),
                  "- Run ID / attempt: " + str(environment.get("github_run_id", "UNKNOWN")) + " / " + str(environment.get("github_run_attempt", "UNKNOWN")),
                  "- Commit: " + str(environment.get("github_sha", "UNKNOWN")),
                  "- Ref: " + str(environment.get("github_ref", "UNKNOWN")),
                  "- Runner: " + str(environment.get("runner_os", "UNKNOWN")) + " / " + str(environment.get("runner_arch", "UNKNOWN")),
                  "- Runner image: " + str(environment.get("image_os", "NOT_EXPOSED")) + " / " + str(environment.get("image_version", "NOT_EXPOSED")),
                  "- Cloud provider: not captured in step environment; provider/region are in runner provisioning logs",
                  "",
                  "| File | Exact bytes | SHA-256 | HTTP | Media type | Content-Length | TLS |",
                  "|---|---:|---|---:|---|---:|---|",
              ]
              for item in report.get("files", []):
                  content_length = item.get("content_length_header")
                  if content_length is None:
                      content_length = "NOT_SUPPLIED"
                  tls = (item.get("tls_validation") or {}).get("result", "UNKNOWN")
                  lines.append(
                      "| " + str(item.get("relative_path", "UNKNOWN"))
                      + " | " + str(item.get("byte_length", "UNKNOWN"))
                      + " | " + str(item.get("sha256", "UNKNOWN"))
                      + " | " + str(item.get("http_status", "UNKNOWN"))
                      + " | " + str(item.get("content_type", "UNKNOWN"))
                      + " | " + str(content_length)
                      + " | " + str(tls) + " |"
                  )
              archive = report.get("archive") or {}
              if archive:
                  lines.extend([
                      "",
                      "Archive: HTTP " + str(archive.get("http_status", "UNKNOWN"))
                      + "; exact bytes " + str(archive.get("byte_length", "UNKNOWN"))
                      + "; SHA-256 " + str(archive.get("sha256", "UNKNOWN")),
                  ])
              failure = report.get("failure")
              if failure:
                  lines.extend([
                      "",
                      "### Failure",
                      "- Stage: " + str(report.get("failed_stage", "UNKNOWN")),
                      "- Type: " + str(failure.get("type", "UNKNOWN")),
                      "- Detail: " + str(failure.get("message", "UNKNOWN")),
                  ])
              lines.extend([
                  "",
                  "- Direct-file versus official UCD.zip comparison: " + str(report.get("cross_representation_status", "NOT_COMPLETED")),
                  "- Independent publisher corroboration: NOT_ESTABLISHED",
                  "- Raw source contents logged: NO",
                  "- Artifacts uploaded: NO",
                  "- Manifest/source lock modified: NO",
                  "- R1-U12-B byte metrics SHA-256: " + str(report.get("byte_metrics_sha256", "NOT_COMPUTED")),
                  "",
                  "| File | BOM | CRLF | LF | CR | Mixed | EOF | Lines | Maximum line bytes |",
                  "|---|---:|---:|---:|---:|---|---|---:|---:|",
              ])
              for item in report.get("files", []):
                  metric = item.get("raw_structure", {})
                  maximum = metric.get("max_line") or {}
                  lines.append(
                      "| " + str(item.get("relative_path", "UNKNOWN"))
                      + " | " + ("YES" if metric.get("leading_utf8_bom") else "NO")
                      + " | " + str((metric.get("eol") or {}).get("crlf", "UNKNOWN"))
                      + " | " + str((metric.get("eol") or {}).get("lf", "UNKNOWN"))
                      + " | " + str((metric.get("eol") or {}).get("cr", "UNKNOWN"))
                      + " | " + ("YES" if metric.get("eol_mixed") else "NO")
                      + " | " + str(metric.get("eof_terminator", "UNKNOWN"))
                      + " | " + str(metric.get("physical_line_count", "UNKNOWN"))
                      + " | " + str(maximum.get("byte_length", "N/A"))
                      + " |"
                  )
              with open(summary_path, "a", encoding="utf-8", newline="\n") as summary:
                  summary.write("\n".join(lines) + "\n")

          def safe_member_name(raw):
              if not isinstance(raw, str) or not raw or "\\" in raw:
                  raise ValueError("unsafe ZIP member path")
              is_dir = raw.endswith("/")
              name = raw[:-1] if is_dir else raw
              if not name or name.startswith("/") or "\x00" in name:
                  raise ValueError("unsafe ZIP member path")
              parts = name.split("/")
              if any(part in ("", ".", "..") for part in parts):
                  raise ValueError("unsafe ZIP member path")
              if ":" in parts[0]:
                  raise ValueError("drive-like ZIP member path")
              try:
                  name.encode("ascii")
              except UnicodeEncodeError as exc:
                  raise ValueError("non-ASCII ZIP member path") from exc
              return name, is_dir

          def validate_zip_index(infos):
              by_name = {}
              folded = {}
              for info in infos:
                  name, is_dir = safe_member_name(info.filename)
                  if name in by_name:
                      raise ValueError("duplicate ZIP member path")
                  key = name.casefold()
                  if key in folded and folded[key] != name:
                      raise ValueError("case-fold-colliding ZIP member paths")
                  folded[key] = name
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise ValueError("symlink ZIP member rejected")
                  if info.flag_bits & 0x1:
                      raise ValueError("encrypted ZIP member rejected")
                  if info.file_size < 0 or info.file_size > MAX_FILE:
                      raise ValueError("ZIP member size limit exceeded")
                  if info.compress_size < 0:
                      raise ValueError("invalid ZIP compressed size")
                  if info.file_size and info.compress_size == 0:
                      raise ValueError("invalid ZIP compression ratio")
                  if info.compress_size and info.file_size / info.compress_size > MAX_RATIO:
                      raise ValueError("ZIP compression ratio limit exceeded")
                  if info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                      raise ValueError("unsupported ZIP compression method")
                  by_name[name] = (info, is_dir)
              for required in REQUIRED:
                  item = by_name.get(required)
                  if item is None or item[1]:
                      raise ValueError("required ZIP member missing: " + required)
              return by_name

          def iter_metric_lines(data):
              start = 0
              line_number = 1
              index = 0
              while index < len(data):
                  if data[index] == 13:
                      yield line_number, start, data[start:index]
                      index += 2 if index + 1 < len(data) and data[index + 1] == 10 else 1
                      start = index
                      line_number += 1
                  elif data[index] == 10:
                      yield line_number, start, data[start:index]
                      index += 1
                      start = index
                      line_number += 1
                  else:
                      index += 1
              if start < len(data):
                  yield line_number, start, data[start:]

          def measure_raw_bytes(data):
              crlf = lf = cr = 0
              max_line = None
              physical_lines = 0
              for number, offset, line in iter_metric_lines(data):
                  physical_lines += 1
                  candidate = {"byte_length": len(line), "line_number": number, "byte_offset": offset}
                  if max_line is None or candidate["byte_length"] > max_line["byte_length"]:
                      max_line = candidate
              index = 0
              while index < len(data):
                  if data[index] == 13:
                      if index + 1 < len(data) and data[index + 1] == 10:
                          crlf += 1
                          index += 2
                      else:
                          cr += 1
                          index += 1
                  elif data[index] == 10:
                      lf += 1
                      index += 1
                  else:
                      index += 1
              leading = data.startswith(b"\xef\xbb\xbf")
              bom_positions = []
              cursor = 0
              while True:
                  pos = data.find(b"\xef\xbb\xbf", cursor)
                  if pos < 0:
                      break
                  bom_positions.append(pos)
                  cursor = pos + 3
              embedded = [pos for pos in bom_positions if pos != 0]
              nul = data.find(b"\x00")
              if not data:
                  eof = "EMPTY"
              elif data.endswith(b"\r\n"):
                  eof = "CRLF"
              elif data.endswith(b"\n"):
                  eof = "LF"
              elif data.endswith(b"\r"):
                  eof = "CR"
              else:
                  eof = "NONE"
              try:
                  data.decode("utf-8", errors="strict")
                  utf8 = {"valid": True, "first_error_offset": None, "error": None}
              except UnicodeDecodeError as exc:
                  utf8 = {"valid": False, "first_error_offset": exc.start, "error": exc.reason}
              return {
                  "byte_length": len(data),
                  "leading_utf8_bom": leading,
                  "leading_bom_offset": 0 if leading else None,
                  "embedded_utf8_bom_count": len(embedded),
                  "embedded_utf8_bom_offsets": embedded[:16],
                  "embedded_utf8_bom_offsets_truncated": len(embedded) > 16,
                  "nul_byte_count": data.count(b"\x00"),
                  "first_nul_byte_offset": nul if nul >= 0 else None,
                  "eol": {"crlf": crlf, "lf": lf, "cr": cr},
                  "eol_mixed": sum(bool(v) for v in (crlf, lf, cr)) > 1,
                  "physical_line_count": physical_lines,
                  "eof_terminator": eof,
                  "max_line": max_line,
                  "utf8": utf8,
              }

          def canonical_manifest_bytes(document):
              return json.dumps(
                  document, ensure_ascii=True, sort_keys=True, separators=(",", ":")
              ).encode("ascii")

          class AcquisitionSafetyTests(unittest.TestCase):
              def test_accepts_expected_relative_file(self):
                  self.assertEqual(safe_member_name("extracted/DerivedGeneralCategory.txt"),
                                   ("extracted/DerivedGeneralCategory.txt", False))

              def test_rejects_parent_traversal(self):
                  with self.assertRaises(ValueError):
                      safe_member_name("../PropList.txt")

              def test_rejects_absolute_and_backslash_paths(self):
                  for value in ("/PropList.txt", "C:/PropList.txt", "extracted\\PropList.txt"):
                      with self.subTest(value=value), self.assertRaises(ValueError):
                          safe_member_name(value)

              def test_rejects_duplicate_paths(self):
                  first = zipfile.ZipInfo("PropList.txt")
                  second = zipfile.ZipInfo("PropList.txt")
                  with self.assertRaisesRegex(ValueError, "duplicate"):
                      validate_zip_index([first, second])

              def test_rejects_casefold_collisions(self):
                  first = zipfile.ZipInfo("PropList.txt")
                  second = zipfile.ZipInfo("proplist.txt")
                  with self.assertRaisesRegex(ValueError, "case-fold"):
                      validate_zip_index([first, second])

              def test_metrics_count_crlf_lf_and_lone_cr(self):
                  m = measure_raw_bytes(b"A\r\nB\nC\rD")
                  self.assertEqual(m["eol"], {"crlf": 1, "lf": 1, "cr": 1})
                  self.assertTrue(m["eol_mixed"])
                  self.assertEqual(m["physical_line_count"], 4)

              def test_metrics_do_not_create_phantom_eof_line(self):
                  self.assertEqual(measure_raw_bytes(b"A\r\nB\n")["physical_line_count"], 2)

              def test_metrics_empty_input_has_zero_lines(self):
                  m = measure_raw_bytes(b"")
                  self.assertEqual(m["physical_line_count"], 0)
                  self.assertIsNone(m["max_line"])
                  self.assertEqual(m["eof_terminator"], "EMPTY")

              def test_metrics_distinguish_leading_and_embedded_bom(self):
                  m = measure_raw_bytes(b"\xef\xbb\xbfA\nB\xef\xbb\xbf")
                  self.assertTrue(m["leading_utf8_bom"])
                  self.assertEqual(m["embedded_utf8_bom_offsets"], [6])

              def test_metrics_use_byte_length_and_original_offset(self):
                  m = measure_raw_bytes("é\nABCD\n".encode("utf-8"))
                  self.assertEqual(m["max_line"], {"byte_length": 4, "line_number": 2, "byte_offset": 3})

              def test_metrics_record_invalid_utf8_without_replacement(self):
                  m = measure_raw_bytes(b"valid\xff\n")
                  self.assertFalse(m["utf8"]["valid"])
                  self.assertEqual(m["utf8"]["first_error_offset"], 5)

              def test_metrics_count_nul_bytes(self):
                  m = measure_raw_bytes(b"A\x00B\n")
                  self.assertEqual(m["nul_byte_count"], 1)
                  self.assertEqual(m["first_nul_byte_offset"], 1)

              def test_manifest_encoding_is_stable(self):
                  sample = {"unicode_version": VERSION, "files": [{"path": "A", "sha256": "00"}]}
                  self.assertEqual(canonical_manifest_bytes(sample),
                                   canonical_manifest_bytes(sample))

              def test_content_length_may_be_absent(self):
                  self.assertIsNone(validate_content_length(None, 12))

              def test_content_length_matches_exact_bytes(self):
                  self.assertTrue(validate_content_length("12", 12))

              def test_rejects_content_length_mismatch(self):
                  with self.assertRaisesRegex(ValueError, "Content-Length"):
                      validate_content_length("11", 12)

              def test_rejects_invalid_content_length(self):
                  with self.assertRaisesRegex(ValueError, "invalid Content-Length"):
                      validate_content_length("unknown", 12)

              def test_tls_context_requires_certificate_and_hostname_verification(self):
                  self.assertEqual(TLS_CONTEXT.verify_mode, ssl.CERT_REQUIRED)
                  self.assertTrue(TLS_CONTEXT.check_hostname)

              def test_tls_context_requires_tls_12_or_newer(self):
                  self.assertEqual(TLS_CONTEXT.minimum_version, ssl.TLSVersion.TLSv1_2)

          suite = unittest.defaultTestLoader.loadTestsFromTestCase(AcquisitionSafetyTests)
          test_result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite)
          if not test_result.wasSuccessful():
              emit_report({
                  "status": "BLOCKED",
                  "unicode_version": VERSION,
                  "acquired_at_utc": datetime.now(timezone.utc).isoformat(),
                  "execution_environment": execution_environment(),
                  "files": [],
                  "failure": {
                      "type": "SafetyTestFailure",
                      "message": "pre-acquisition safety tests failed",
                  },
                  "raw_source_contents_logged": False,
                  "artifacts_uploaded": False,
              })
              raise SystemExit("pre-acquisition safety tests failed")

          def fetch_exact(url, maximum, expected_kind):
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "https" or parsed.hostname != "www.unicode.org":
                  raise ValueError("source URL is outside the pinned Unicode HTTPS origin")
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "MasterBrain-Unicode18-Audit/1.0",
                      "Accept-Encoding": "identity",
                      "Accept": "application/zip, text/plain, application/octet-stream",
                  },
                  method="GET",
              )
              last_error = None
              for attempt in range(3):
                  request_started_at_utc = datetime.now(timezone.utc).isoformat()
                  try:
                      with HTTPS_OPENER.open(request, timeout=25) as response:
                          final = urllib.parse.urlsplit(response.geturl())
                          if (final.scheme != "https" or final.hostname != "www.unicode.org"
                                  or final.path != parsed.path or final.query or final.fragment):
                              raise ValueError("unexpected redirect target")
                          if response.status != 200:
                              raise ValueError("unexpected HTTP status: " + str(response.status))
                          content_type = response.headers.get_content_type().lower()
                          if content_type not in ALLOWED_TYPES:
                              raise ValueError("unexpected content type: " + content_type)
                          encoding = response.headers.get("Content-Encoding", "identity").lower()
                          if encoding not in ("", "identity"):
                              raise ValueError("unexpected content encoding: " + encoding)
                          content_lengths = response.headers.get_all("Content-Length", [])
                          if len(content_lengths) > 1:
                              raise ValueError("multiple Content-Length headers rejected")
                          declared = content_lengths[0].strip() if content_lengths else None
                          if declared is not None and int(declared) > maximum:
                              raise ValueError("declared response size exceeds limit")
                          chunks = []
                          total = 0
                          while True:
                              chunk = response.read(min(1024 * 1024, maximum + 1 - total))
                              if not chunk:
                                  break
                              chunks.append(chunk)
                              total += len(chunk)
                              if total > maximum:
                                  raise ValueError("response size exceeds limit")
                          body = b"".join(chunks)
                          content_length_matches = validate_content_length(declared, len(body))
                          if not body:
                              raise ValueError("empty response body")
                          if expected_kind == "zip" and not body.startswith(b"PK"):
                              raise ValueError("UCD.zip signature is missing")
                          if expected_kind == "text" and b"\x00" in body:
                              raise ValueError("unexpected NUL in text source")
                          return body, {
                              "requested_url": url,
                              "final_url": response.geturl(),
                              "request_started_at_utc": request_started_at_utc,
                              "response_completed_at_utc": datetime.now(timezone.utc).isoformat(),
                              "http_status": response.status,
                              "content_type": content_type,
                              "content_encoding": encoding or "identity",
                              "content_length_header": declared,
                              "content_length_matches_received": content_length_matches,
                              "response_headers": {
                                  "date": response.headers.get("Date"),
                                  "etag": response.headers.get("ETag"),
                                  "last_modified": response.headers.get("Last-Modified"),
                                  "cache_control": response.headers.get("Cache-Control"),
                              },
                              "tls_validation": {
                                  "result": "PASS",
                                  "method": "ssl.create_default_context",
                                  "verify_mode": "CERT_REQUIRED",
                                  "hostname_check": True,
                                  "minimum_tls_version": "TLSv1.2",
                              },
                              "raw_byte_preserving": True,
                              "byte_length": len(body),
                          }
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as exc:
                      last_error = exc
                      if attempt == 2:
                          break
                      time.sleep(2 ** attempt)
              raise RuntimeError("source acquisition failed after bounded retries: " + str(last_error))

          def validate_text_source(path, data):
              data.decode("utf-8", errors="strict")
              if path == "UnicodeData.txt":
                  previous = -1
                  rows = 0
                  for line_number, line in enumerate(data.splitlines(), 1):
                      fields = line.split(b";")
                      if len(fields) != 15 or not re.fullmatch(rb"[0-9A-Fa-f]{4,6}", fields[0]):
                          raise ValueError("UnicodeData.txt malformed row at line " + str(line_number))
                      codepoint = int(fields[0], 16)
                      if codepoint <= previous:
                          raise ValueError("UnicodeData.txt code points are not strictly increasing")
                      previous = codepoint
                      rows += 1
                  if rows == 0:
                      raise ValueError("UnicodeData.txt has no records")
                  return "15-field UTF-8 records; strictly increasing code points; rows=" + str(rows)
              if VERSION.encode("ascii") not in data[:32768]:
                  raise ValueError("version marker 18.0.0 not found in header window: " + path)
              return "Unicode 18.0.0 marker present in first 32768 bytes"

          def main():
              report = {
                  "status": "BLOCKED",
                  "unicode_version": VERSION,
                  "acquired_at_utc": None,
                  "execution_environment": execution_environment(),
                  "archive": None,
                  "files": [],
                  "cross_representation_status": "NOT_COMPLETED",
                  "stable_manifest_sha256": None,
                  "raw_source_contents_logged": False,
                  "artifacts_uploaded": False,
                  "independent_publisher_corroboration": "NOT_ESTABLISHED",
                  "source_provenance_scope": "official Unicode direct files compared byte-for-byte with official Unicode UCD.zip; same publisher",
                  "independent_reproduction_scope": "separate curl/unzip job environment; same GitHub Actions control plane; cloud-provider independence NOT_ESTABLISHED",
                  "manifest_or_source_lock_modified": False,
              }
              stage = "archive_acquisition"
              try:
                  archive_bytes, archive_meta = fetch_exact(ARCHIVE_URL, MAX_ARCHIVE, "zip")
                  archive_meta["sha256"] = hashlib.sha256(archive_bytes).hexdigest()
                  report["archive"] = archive_meta

                  direct = {}
                  direct_meta = {}
                  total = 0
                  for path in REQUIRED:
                      stage = "direct_file_acquisition:" + path
                      body, meta = fetch_exact(ROOT + path, MAX_FILE, "text")
                      total += len(body)
                      if total > MAX_TOTAL:
                          raise ValueError("aggregate direct-source size limit exceeded")
                      header_result = validate_text_source(path, body)
                      direct[path] = body
                      meta["sha256"] = hashlib.sha256(body).hexdigest()
                      meta["header_validation"] = header_result
                      direct_meta[path] = meta
                      report["files"].append({
                          "relative_path": path,
                          **meta,
                      })

                  stage = "zip_index_validation_and_byte_comparison"
                  with zipfile.ZipFile(BytesIO(archive_bytes), "r") as archive:
                      index = validate_zip_index(archive.infolist())
                      results = []
                      for path in REQUIRED:
                          info, _ = index[path]
                          if info.file_size > MAX_FILE:
                              raise ValueError("required ZIP member exceeds size limit: " + path)
                          packaged = archive.read(info)
                          if len(packaged) != info.file_size:
                              raise ValueError("ZIP member size mismatch: " + path)
                          if packaged != direct[path]:
                              raise ValueError("direct-download and UCD.zip bytes differ: " + path)
                          results.append({
                              "relative_path": path,
                              **direct_meta[path],
                              "zip_member_byte_length": len(packaged),
                              "zip_member_sha256": hashlib.sha256(packaged).hexdigest(),
                              "direct_vs_zip_equal": True,
                          })
                  for item in results:
                      raw = direct[item["relative_path"]]
                      item["raw_structure"] = measure_raw_bytes(raw)
                      item["raw_sha256_before_metrics"] = hashlib.sha256(raw).hexdigest()
                      item["raw_sha256_after_metrics"] = hashlib.sha256(raw).hexdigest()
                      if item["raw_sha256_before_metrics"] != item["raw_sha256_after_metrics"]:
                          raise ValueError("raw bytes changed during metrics collection")
                  report["files"] = results
                  report["cross_representation_status"] = "SUPPORTED_FOR_ALL_NINE_FILES"

                  stable = {
                      "unicode_version": VERSION,
                      "source_root": ROOT,
                      "archive": {
                          "url": ARCHIVE_URL,
                          "byte_length": archive_meta["byte_length"],
                          "sha256": archive_meta["sha256"],
                      },
                      "files": [
                          {
                              "relative_path": item["relative_path"],
                              "byte_length": item["byte_length"],
                              "sha256": item["sha256"],
                              "zip_member_sha256": item["zip_member_sha256"],
                              "direct_vs_zip_equal": item["direct_vs_zip_equal"],
                              "header_validation": item["header_validation"],
                          }
                          for item in results
                      ],
                  }
                  report["stable_manifest_sha256"] = hashlib.sha256(
                      canonical_manifest_bytes(stable)
                  ).hexdigest()
                  byte_metrics_payload = {
                      "gate_id": "R1-U12-B",
                      "tool_version": "1.0.0",
                      "unicode_version": VERSION,
                      "source_manifest_stable_sha256": report["stable_manifest_sha256"],
                      "files": [
                          {
                              "relative_path": item["relative_path"],
                              "sha256_before_metrics": item["raw_sha256_before_metrics"],
                              "sha256_after_metrics": item["raw_sha256_after_metrics"],
                              "structural": item["raw_structure"],
                          }
                          for item in results
                      ],
                  }
                  report["byte_metrics_sha256"] = hashlib.sha256(
                      canonical_manifest_bytes(byte_metrics_payload)
                  ).hexdigest()
                  report["status"] = "SUPPORTED"
                  report["acquired_at_utc"] = datetime.now(timezone.utc).isoformat()
              except Exception as exc:
                  report["status"] = "BLOCKED"
                  report["failed_stage"] = stage
                  report["failure"] = {
                      "type": type(exc).__name__,
                      "message": str(exc)[:1000],
                  }
                  report["acquired_at_utc"] = datetime.now(timezone.utc).isoformat()
                  emit_report(report)
                  raise

              emit_report(report)


          main()
          PY

  independent-shell-reproduction:
    name: Independent curl and unzip reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Reacquire and independently compare all nine files
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.unicode.org/Public/18.0.0/ucd"
          tmp="$(mktemp -d)"
          summary="$GITHUB_STEP_SUMMARY"
          trap 'rc=$?; if [ "$rc" -eq 0 ]; then result=SUPPORTED; else result=BLOCKED; fi; printf "\n- Final independent-shell status: **%s** (exit %s)\n" "$result" "$rc" >> "$summary"; rm -rf "$tmp"; exit "$rc"' EXIT
          mkdir -p "$tmp/direct" "$tmp/member"
          archive="$tmp/UCD.zip"
          {
            printf "## Unicode 18.0.0 independent curl/unzip reproduction\n\n"
            printf -- "- Status: **RUNNING**\n"
            printf -- "- Run ID: %s / attempt %s\n" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf -- "- Commit: %s\n" "$GITHUB_SHA"
            printf -- "- Ref: %s\n" "$GITHUB_REF"
            printf -- "- Runner: %s / %s\n" "$RUNNER_OS" "$RUNNER_ARCH"
            printf -- "- Runner image: %s / %s\n" "$(printenv ImageOS 2>/dev/null || echo NOT_EXPOSED)" "$(printenv ImageVersion 2>/dev/null || echo NOT_EXPOSED)"
            printf -- "- Cloud provider: not captured in step environment; see runner provisioning log header\n"
            printf -- "- Independent scope: distinct curl/unzip implementation and separate job environment; same GitHub Actions control plane\n\n"
            printf "| Requested URL | HTTP | Exact bytes | Content-Length | Media type | TLS verify result | Request interval (UTC) |\n"
            printf "|---|---:|---:|---:|---|---:|---|\n"
          } >> "$summary"

          fetch_one() {
            local url="$1" destination="$2" limit="$3" expected="$4"
            local metadata status content_type size effective verify_result actual headers declared declared_count started finished
            headers="$destination.headers"
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            metadata="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-redirs 0 --max-filesize "$limit" \
              --dump-header "$headers" \
              --output "$destination" \
              --write-out '%{http_code}\t%{content_type}\t%{size_download}\t%{url_effective}\t%{ssl_verify_result}' \
              "$url")"
            finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            IFS=$'\t' read -r status content_type size effective verify_result <<< "$metadata"
            test "$status" = "200"
            test "$effective" = "$url"
            test "$verify_result" = "0"
            case "$expected:$content_type" in
              zip:application/zip*|zip:application/octet-stream*|text:text/plain*|text:application/octet-stream*) ;;
              *) echo "unexpected content type for $url: $content_type" >&2; exit 1 ;;
            esac
            actual="$(wc -c < "$destination" | tr -d ' ')"
            test "$actual" = "$size"
            test "$actual" -gt 0
            declared_count="$(awk 'tolower($1) == "content-length:" { count++ } END { print count+0 }' "$headers")"
            test "$declared_count" -le 1
            declared="$(awk 'tolower($1) == "content-length:" { gsub("\r", "", $2); value=$2 } END { print value }' "$headers")"
            if [ -z "$declared" ]; then
              declared="NOT_SUPPLIED"
            else
              test "$declared" = "$actual"
            fi
            printf 'TRANSFER\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$url" "$status" "$actual" "$declared" "$content_type" "$verify_result" "$started/$finished"
            printf "| %s | %s | %s | %s | %s | %s | %s / %s |\n" "$url" "$status" "$actual" "$declared" "$content_type" "$verify_result" "$started" "$finished" >> "$summary"
          }

          echo "INDEPENDENT_REPRODUCTION_BEGIN"
          fetch_one "$base/UCD.zip" "$archive" 41943040 zip
          unzip -tqq "$archive"
          archive_size="$(wc -c < "$archive" | tr -d ' ')"
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'ARCHIVE\t%s\t%s\n' "$archive_size" "$archive_sha"
          printf -- "\n- UCD.zip exact byte length: %s\n- UCD.zip SHA-256: %s\n" "$archive_size" "$archive_sha" >> "$summary"

          listing="$tmp/listing.txt"
          unzip -Z1 "$archive" > "$listing"
          for path in ReadMe.txt PropList.txt DerivedCoreProperties.txt DerivedAge.txt extracted/DerivedGeneralCategory.txt UnicodeData.txt CaseFolding.txt DerivedNormalizationProps.txt NormalizationTest.txt; do
            count="$(grep -Fxc -- "$path" "$listing" || true)"
            test "$count" = "1"
            mkdir -p "$tmp/direct/$(dirname "$path")" "$tmp/member/$(dirname "$path")"
            fetch_one "$base/$path" "$tmp/direct/$path" 26214400 text
            unzip -p "$archive" "$path" > "$tmp/member/$path"
            cmp --silent "$tmp/direct/$path" "$tmp/member/$path"
            direct_size="$(wc -c < "$tmp/direct/$path" | tr -d ' ')"
            direct_sha="$(sha256sum "$tmp/direct/$path" | cut -d ' ' -f 1)"
            member_size="$(wc -c < "$tmp/member/$path" | tr -d ' ')"
            member_sha="$(sha256sum "$tmp/member/$path" | cut -d ' ' -f 1)"
            test "$direct_size" = "$member_size"
            test "$direct_sha" = "$member_sha"
            printf 'FILE\t%s\t%s\t%s\t%s\tBYTE_EQUAL\n' "$path" "$direct_size" "$direct_sha" "$member_sha"
            printf -- "- %s: direct bytes equal ZIP member; SHA-256 reproduced: SUPPORTED\n" "$path" >> "$summary"
          done
          echo "FILES_VERIFIED=9"
          echo "INDEPENDENT_REPRODUCTION_END"
