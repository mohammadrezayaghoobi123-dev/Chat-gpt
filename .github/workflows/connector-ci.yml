name: Cloud Engineering Connector CI

on:
  pull_request:
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"
  push:
    branches:
      - "feature/cloud-engineering-connector"
      - "release/production"
      - "assistant/**"
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"

permissions:
  contents: read

concurrency:
  group: connector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin npm CLI for deterministic dependency resolution
        run: npm install --global npm@11.21.1
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Export resolved package lock
        uses: actions/upload-artifact@v4
        with:
          name: connector-package-lock-${{ github.sha }}
          path: cloud-engineering-connector/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
