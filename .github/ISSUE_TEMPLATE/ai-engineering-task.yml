name: AI Engineering Task
description: Create a traceable engineering task for the centralized operations workflow.
title: "[Engineering]: "
labels: ["engineering"]
body:
  - type: markdown
    attributes:
      value: |
        Link this task to the Notion Operations Hub. Do not include secrets, tokens, personal data, or production credentials.
  - type: dropdown
    id: work_type
    attributes:
      label: Work type
      options:
        - Architecture
        - Implementation
        - Bug
        - Security
        - Testing
        - Infrastructure
        - Documentation
        - Release readiness
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical
        - P1 - High
        - P2 - Normal
        - P3 - Low
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / objective
      description: State the observable problem and desired outcome.
      placeholder: What needs to change and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Include affected services, allowed changes, and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable, objective completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproduction
      description: Include links, exact SHA, CI run, logs with secrets redacted, or reproduction steps.
  - type: textarea
    id: risks
    attributes:
      label: Risks, dependencies, and rollback
      description: Identify security impact, dependencies, release gates, and rollback strategy.
    validations:
      required: true
  - type: textarea
    id: notion
    attributes:
      label: Notion Operations Hub link
      description: Link the matching project/task record.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: No secrets or credential values are included.
          required: true
        - label: No change to main or Production is implied without explicit owner authorization.
          required: true
