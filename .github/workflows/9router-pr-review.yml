name: 9Router Trusted Manual Review Bootstrap

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to resolve from the live repository API
        required: true
        type: string

permissions:
  contents: none
  pull-requests: none

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor_id == '335530603') ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/review-canary' &&
       github.actor_id == '335530603')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install exact locked dependencies without lifecycle scripts
        working-directory: tools/9router-review
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run reviewer and resolver unit tests
        working-directory: tools/9router-review
        run: npm test

      - name: Resolve and validate the live pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR_ID: ${{ github.actor_id }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/9router-review/resolve-pr.mjs

  reviewer:
    if: false
    needs: resolve
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Keep reviewer execution disabled in the bootstrap
        run: echo "Reviewer execution is intentionally disabled."
