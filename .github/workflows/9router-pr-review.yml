name: Independent 9Router PR Review

on:
  push:
    branches:
      - feature/independent-9router-pr-review
    paths:
      - "tools/9router-review/**"
      - ".github/workflows/9router-pr-review.yml"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: 9router-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run reviewer contract tests
        run: node --test tools/9router-review/review.test.mjs

  review:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_API_URL }}
      ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
      ROUTER_MODEL: ${{ vars.NINE_ROUTER_MODEL }}
      REPOSITORY: ${{ github.repository }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check reviewer configuration
        if: env.ROUTER_BASE_URL == '' || env.ROUTER_API_KEY == '' || env.ROUTER_MODEL == ''
        run: |
          echo "::notice::9Router review is not configured. Add NINE_ROUTER_API_URL and NINE_ROUTER_API_KEY secrets and NINE_ROUTER_MODEL repository variable. No review was attempted."
      - name: Checkout trusted base-branch reviewer code only
        if: env.ROUTER_BASE_URL != '' && env.ROUTER_API_KEY != '' && env.ROUTER_MODEL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run report-only independent review
        if: env.ROUTER_BASE_URL != '' && env.ROUTER_API_KEY != '' && env.ROUTER_MODEL != ''
        run: node tools/9router-review/run-review.mjs
