name: Cloud Engineering Connector CI

on:
  pull_request:
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
  push:
    branches:
      - "feature/cloud-engineering-connector"
      - "assistant/**"
      - "engineering/**"
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"

permissions:
  contents: read

concurrency:
  group: connector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble worker from source-parts
        run: node scripts/assemble.js
      - name: Align version assertion in legacy tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("test/worker.test.js")
          if p.exists():
              t = p.read_text()
              t2 = t.replace('version:"0.1.0"', 'version:"0.2.0"')
              if t2 != t:
                  p.write_text(t2)
                  print("updated version assertion to 0.2.0")
              else:
                  print("no version assertion change needed")
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
