name: Master Brain MVP tests

on:
  push:
    branches:
      - master-brain/integrated-mvp
      - master-brain/proof-protocol-v0
      - master-brain/integrated
  pull_request:
    branches:
      - main
      - master-brain/integrated-mvp
  workflow_dispatch:

permissions:
  contents: read

env:
  MB_REQUIRE_SIGNING_TESTS: "1"
  MB_REQUIRE_SANDBOX_TESTS: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Allow unprivileged user namespaces (needed by the CTP runner sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user --net --pid --fork --mount-proc true && echo "::notice::user namespaces usable"
      - name: Install package
        run: python -m pip install -e ".[signing]"
      - name: Run unit tests
        shell: bash   # pipefail: the job still fails exactly when the tests fail
        run: python -m unittest discover -s tests -v 2>&1 | tee unittest-out.txt
      - name: Surface failing tests as annotations (diagnostic only; does not change the result)
        if: failure()
        run: |
          python - <<'PY'
          import re
          text = open("unittest-out.txt", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n={70}\n", text)
          bad = [b for b in blocks if b.startswith(("FAIL:", "ERROR:"))]
          tail = text.strip().splitlines()[-3:]
          print("::notice::summary " + " | ".join(tail))
          for b in bad[:12]:
              lines = b.strip().splitlines()
              body = "\n".join([lines[0][:200]] + lines[-8:])[:900]
              print("::error::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          if not bad:
              print("::notice::no FAIL/ERROR blocks found; last lines: " + " | ".join(text.strip().splitlines()[-6:])[:600])
          PY
      - name: Run offline demo
        run: python -m master_brain.demo
