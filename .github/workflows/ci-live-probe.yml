name: ci-live-probe
on:
  push:
    paths: [".github/diag/worker_url.txt", ".github/workflows/ci-live-probe.yml"]
    branches: ["ci/flake-stress-2026-10-28"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only probe (no secrets, no writes)
        run: |
          URL="$(tr -d ' \r\n' < .github/diag/worker_url.txt)"
          if [ -z "$URL" ]; then echo "::warning::worker_url.txt is empty; nothing probed"; exit 0; fi
          case "$URL" in https://*.workers.dev|https://*.workers.dev/) ;; *) echo "::error::URL must be https://*.workers.dev"; exit 1;; esac
          URL="${URL%/}"
          c() { curl -s -o /tmp/b -w '%{http_code}' --max-time 15 "$@"; }
          echo "::notice::healthz=$(c "$URL/healthz")"
          echo "::notice::root=$(c "$URL/")"
          echo "::notice::tools_list_noauth=$(c -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$URL/mcp") body=$(head -c 200 /tmp/b)"
          echo "::notice::bad_origin=$(c -X POST -H 'Origin: https://evil.example' -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$URL/mcp")"
          codes=""; for i in $(seq 1 400); do codes="$codes $(c -X POST -H "content-type: application/json" -H "accept: application/json, text/event-stream" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}" "$URL/mcp")"; done
          echo "::notice::burst400_mcp=$(echo $codes | tr ' ' '\n' | sort | uniq -c | tr '\n' ' ')"
      - name: Write-gate check (invalid arguments only; must never create anything) and concurrent burst
        run: |
          URL="$(tr -d ' \r\n' < .github/diag/worker_url.txt)"; URL="${URL%/}"
          H=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream')
          echo "::notice::write_tool_noauth=$(curl -s --max-time 15 "${H[@]}" -X POST -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"create_change_pr","arguments":{}}}' "$URL/mcp" | head -c 300)"
          echo "::notice::tools_in_noauth_list=$(curl -s --max-time 15 "${H[@]}" -X POST -d '{"jsonrpc":"2.0","id":3,"method":"tools/list"}' "$URL/mcp" | grep -o '"name":"[a-z_]*"' | tr '\n' ' ')"
          seq 1 300 | xargs -P 25 -I{} curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 "${H[@]}" -X POST -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$URL/mcp" | sort | uniq -c | tr '\n' ' ' | sed 's/^/::notice::concurrent300=/'
      - name: Failed-auth rate limit (wrong bearer, 300 requests, 25 concurrent)
        run: |
          URL="$(tr -d ' \r\n' < .github/diag/worker_url.txt)"; URL="${URL%/}"
          seq 1 300 | xargs -P 25 -I{} curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 -H 'authorization: Bearer wrong-probe-token' -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -X POST -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$URL/mcp" | sort | uniq -c | tr '\n' ' ' | sed 's/^/::notice::wrongbearer300=/'
          echo "::notice::healthz_after=$(curl -s --max-time 15 "$URL/healthz")"
