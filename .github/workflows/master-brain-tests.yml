name: Master Brain MVP tests

on:
  push:
    branches:
      - master-brain/integrated-mvp
      - master-brain/proof-protocol-v0
      - master-brain/integrated
  pull_request:
    branches:
      - main
      - master-brain/integrated-mvp

permissions:
  contents: read

env:
  MB_REQUIRE_SIGNING_TESTS: "1"
  MB_REQUIRE_SANDBOX_TESTS: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Allow unprivileged user namespaces (needed by the CTP runner sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user --net --pid --fork --mount-proc true && echo "::notice::user namespaces usable"
      - name: Install package
        run: python -m pip install -e ".[signing]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python -m master_brain.demo
