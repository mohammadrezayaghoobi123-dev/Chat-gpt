title = "Project Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic curl bearer probe fixture, restricted to its exact historical commit, file, and value."
targetRules = ["curl-auth-header"]
condition = "AND"
commits = ["7984973353e49b218a5621ed9257ccea0cf1fff7"]
paths = ['''^\.github/workflows/ci-live-probe\.yml$''']
regexTarget = "line"
regexes = ['''wrong-probe-token''']

[[allowlists]]
description = "Synthetic idempotency test values, restricted to exact literals in one historical test file and commit."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["af1d557bd1de6b38856e931272130774130caca4"]
paths = ['''^cloud-engineering-connector/test/worker\.test\.js$''']
regexTarget = "line"
regexes = [
  '''idempotency_key\s*:\s*["']worker-test-key-["']''',
  '''idempotency_key\s*:\s*["']case-normalization-key-0001["']''',
  '''idempotency_key\s*:\s*["']worker-recovery-0001["']''',
  '''idempotency_key\s*:\s*["']branch-recovery-422-key-001["']''',
  '''idempotency_key\s*:\s*["']fixed-commit-date-test-0001["']''',
  '''idempotency_key\s*:\s*["']unknown-commit-replay-0001["']''',
  '''idempotency_key\s*:\s*["']unknown-tree-replay-0001["']''',
  '''idempotency_key\s*:\s*["']unknown-treewritten-replay-01["']''',
  '''idempotency_key\s*:\s*["']missing-lease-generation-0001["']'''
]

[[allowlists]]
description = "Official AWS example credential in a negative test, restricted to its exact historical commit, file, and value."
targetRules = ["aws-access-token"]
condition = "AND"
commits = ["2707fe59768b3a98d2598cdd3d43f9d5e57510c4"]
paths = ['''^tests/test_audit_policy\.py$''']
regexTarget = "line"
regexes = ['''AKIAABCDEFGHIJKLMNOP''']

[[allowlists]]
description = "Synthetic API-key-shaped negative-test value, restricted to its exact historical commit, file, and value."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["2707fe59768b3a98d2598cdd3d43f9d5e57510c4"]
paths = ['''^tests/test_audit_policy\.py$''']
regexTarget = "line"
regexes = ['''sk-live-1234567890abcdef''']

[[allowlists]]
description = "Synthetic MCP bearer fixtures in connector tests; exact commit and path only."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["59e0ef03557fb9afac2cc879197e2067d074c235"]
paths = ['''^cloud-engineering-connector/test/worker\.test\.js$''']
regexTarget = "line"
regexes = ['''MCP_AUTH_TOKEN\s*:\s*["']0123456789abcdef0123456789abcdef["']''']

[[allowlists]]
description = "Synthetic credential fixture in connector credential-matrix test; exact commit and path only."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["6c079c67e457956bd1446511fe21327da71313b1"]
paths = ['''^cloud-engineering-connector/test/credential-matrix\.test\.js$''']
regexTarget = "line"
regexes = ['''const\s+SECRET\s*=\s*["']0123456789abcdef0123456789abcdef["']''']

[[allowlists]]
description = "Synthetic bearer fixture in connector worker test; exact commit and path only."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["ffa7b132922370296651499b60bd95212c39f69b"]
paths = ['''^cloud-engineering-connector/test/worker\.test\.js$''']
regexTarget = "line"
regexes = ['''const\s+token\s*=\s*["']0123456789abcdef0123456789abcdef["']''']


[[allowlists]]
description = "Synthetic MCP bearer value used only in historical architecture-analysis tests; restricted to the exact test literal, file, and commits."
targetRules = ["generic-api-key"]
condition = "AND"
commits = [
  "6f01511c90782f7db45ae0b8da72cc8ed3aaab74",
  "85b9f2a4e524e45fae701a7237935d868ac15bbf"
]
paths = ['''^cloud-engineering-connector/test/architecture-analysis\.test\.js$''']
regexTarget = "line"
regexes = ['''MCP_AUTH_TOKEN\s*:\s*["']test-secret-0123456789abcdef012345["']''']

[[allowlists]]
description = "Synthetic Vault-proposal idempotency test keys (not credentials); restricted to the exact commit, test file, and two literals."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["651dabe22b062a224f911e42ddbe043dcdec5c12"]
paths = ['''^cloud-engineering-connector/test/write-hardening\.test\.js$''']
regexTarget = "line"
regexes = [
  '''idempotencyKey\s*:\s*["']vault-proposal-stale-0001["']''',
  '''idempotencyKey\s*:\s*["']vault-proposal-success-0001["']'''
]

[[allowlists]]
description = "Synthetic, deliberately invalid JWT assembled only inside the historical evidence-redaction unit test; exact commit, path, and fixture components only."
targetRules = ["jwt"]
condition = "AND"
commits = ["4cb3f9b9a2a64ccacb704066de1974a9af134c49"]
paths = ['''^cloud-engineering-connector/test/orchestrator-preflight\.test\.js$''']
regexTarget = "line"
regexes = ['''eyJhbGciOiJIUzI1NiJ9.*eyJzdWIiOiJ1c2VyIn0.*signaturepayloadlongenough123456''']


[[allowlists]]
description = "Synthetic outbox event and idempotency identifiers in one historical worker test; restricted to the exact commit, path, and fixture line."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["6dd3ef5270b89a8b76efaecf0f5c519d4dfe8eae"]
paths = ['''^cloud-engineering-connector/test/worker\.test\.js$''']
regexTarget = "line"
regexes = ['''eventId:"evt-consumer-00000001",idempotencyKey:"idem-consumer-0001"''']

[[allowlists]]
description = "Suppress generic-api-key findings only in this exact historical worker-identity test file and commit; this entry is commit/path scoped, not line scoped."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["d5ffafb6df54e26189d8494548f7693fdcfdf108"]
paths = ['''^cloud-engineering-connector/test/orchestrator-worker-identity\.test\.js$''']

[[allowlists]]
description = "Suppress generic-api-key findings only in this exact historical outbox-publisher test file and commit; this entry is commit/path scoped, not line scoped."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["a5c36d1c2e7461e38578a688133c797f541b4b46"]
paths = ['''^cloud-engineering-connector/test/orchestrator-outbox-publisher\.test\.js$''']


[[allowlists]]
description = "Synthetic idempotency identifier in a historical OrchestratorLedger negative test; exact commit, file, rule, and literal line only."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["916436f86dc076916bc5588a61b92e710a6680f9"]
paths = ['''^cloud-engineering-connector/cloudflare-test/orchestrator-ledger\.test\.js$''']
regexTarget = "line"
regexes = ['''idempotencyKey\s*:\s*["']idem-transition-sensitive-0001["']''']


[[allowlists]]
description = "Synthetic legacy idempotency identifier used only in the v7-to-v8 migration fixture; exact commit, file, literal, and rule only."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["168a5097fa6c50f4351c5d753ee0358403175a7d"]
paths = ['''^cloud-engineering-connector/cloudflare-test/orchestrator-ledger-tenant-scope-migration\.test\.js$''']
regexTarget = "line"
regexes = ['''legacy-idempotency-1''']

[[allowlists]]
description = "Deliberate credential-shaped negative fixture proving that memory-sync rejects secret-like text; exact commit, file, rule, and literal only."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["fe0302ea9927936f70c8a4acc577cae0b140e2d7"]
paths = ['''^cloud-agent/test/memory-sync\.test\.js$''']
regexTarget = "line"
regexes = ['''api_key = .abcd1234efgh5678''']
