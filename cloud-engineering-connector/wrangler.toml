name = "chat-gpt111"
main = "index.js"
compatibility_date = "2026-10-23"
workers_dev = true
keep_vars = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
PUBLIC_READ_ONLY = "true"
ORCHESTRATOR_OUTBOX_QUEUE_NAME = "chat-gpt111-orchestrator-outbox"
ORCHESTRATOR_OUTBOX_DLQ_QUEUE = "chat-gpt111-orchestrator-outbox-dlq"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294163"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "WRITE_CONTROL"
class_name = "WriteControl"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WriteControl"]

[[durable_objects.bindings]]
name = "KNOWLEDGE_STORE"
class_name = "KnowledgeStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KnowledgeStore"]

[[durable_objects.bindings]]
name = "ORCHESTRATOR_LEDGER"
class_name = "OrchestratorLedger"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OrchestratorLedger"]

[[queues.producers]]
binding = "ORCHESTRATOR_OUTBOX_QUEUE"
queue = "chat-gpt111-orchestrator-outbox"

[[queues.consumers]]
queue = "chat-gpt111-orchestrator-outbox"
max_batch_size = 5
max_batch_timeout = 5
max_concurrency = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "chat-gpt111-orchestrator-outbox-dlq"

[[queues.consumers]]
queue = "chat-gpt111-orchestrator-outbox-dlq"
max_batch_size = 5
max_batch_timeout = 5
max_concurrency = 2
max_retries = 100
retry_delay = 3600

[env.staging]

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.vars]
PUBLIC_READ_ONLY = "true"
ORCHESTRATOR_OUTBOX_QUEUE_NAME = "chat-gpt111-staging-orchestrator-outbox"
ORCHESTRATOR_OUTBOX_DLQ_QUEUE = "chat-gpt111-staging-orchestrator-outbox-dlq"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.staging.observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[[env.staging.ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "78294164"

[env.staging.ratelimits.simple]
limit = 60
period = 60

[[env.staging.durable_objects.bindings]]
name = "WRITE_CONTROL"
class_name = "WriteControl"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["WriteControl"]

[[env.staging.durable_objects.bindings]]
name = "KNOWLEDGE_STORE"
class_name = "KnowledgeStore"

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["KnowledgeStore"]

[[env.staging.durable_objects.bindings]]
name = "ORCHESTRATOR_LEDGER"
class_name = "OrchestratorLedger"

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["OrchestratorLedger"]


[[env.staging.queues.producers]]
binding = "ORCHESTRATOR_OUTBOX_QUEUE"
queue = "chat-gpt111-staging-orchestrator-outbox"

[[env.staging.queues.consumers]]
queue = "chat-gpt111-staging-orchestrator-outbox"
max_batch_size = 5
max_batch_timeout = 5
max_concurrency = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "chat-gpt111-staging-orchestrator-outbox-dlq"

[[env.staging.queues.consumers]]
queue = "chat-gpt111-staging-orchestrator-outbox-dlq"
max_batch_size = 5
max_batch_timeout = 5
max_concurrency = 2
max_retries = 100
retry_delay = 3600
