name: Cloud Engineering Connector CI

on:
  pull_request:
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"
  push:
    branches:
      - "feature/cloud-engineering-connector"
      - "release/production"
      - "assistant/**"
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
      - ".github/workflows/cloud-engineering-connector.yml"

permissions:
  contents: read

concurrency:
  group: connector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/assistant/durable-write-control-2026-10-30'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: connector-lockfile-sync-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pin npm CLI
        run: npm install --global npm@11.21.1
      - name: Generate deterministic package lock
        working-directory: cloud-engineering-connector
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-engineering-connector/package-lock.json
          if git diff --cached --quiet; then
            echo "Package lock is already current."
            exit 0
          fi
          git commit -m "build: commit reproducible connector lockfile"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_BRANCH}"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: "22"
      - name: Pin npm CLI for deterministic dependency resolution
        run: npm install --global npm@11.21.1
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Export resolved package lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: connector-package-lock-${{ github.sha }}
          path: cloud-engineering-connector/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
