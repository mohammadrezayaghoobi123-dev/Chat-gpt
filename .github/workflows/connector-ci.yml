name: Cloud Engineering Connector CI

on:
  pull_request:
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"
  push:
    branches:
      - "feature/cloud-engineering-connector"
      - "assistant/**"
    paths:
      - "cloud-engineering-connector/**"
      - ".github/workflows/connector-ci.yml"

permissions:
  contents: read

concurrency:
  group: connector-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-engineering-connector
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
